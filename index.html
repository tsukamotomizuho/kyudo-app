<title>弓道 的中分析アプリ</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--primary:#1f3a52;--head:#1f3a52;--accent:#b83b3b;--text:#222;--muted:#666;--border:#ddd6c7;--soft:#f0f4f8;--soft2:#fafafa;--info:#1b4f72;--chk:#eef6fc;--chkb:#85c1e9;--btn:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1f2429;--primary:#3d6a94;--head:#9cc3e6;--text:#e8e6e1;--muted:#a3a8ad;--border:#363d44;--soft:#232c36;--soft2:#252b31;--info:#9cc9ea;--chk:#1d2e3d;--chkb:#3d6a94;--btn:#2a3138}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1f2429;--primary:#3d6a94;--head:#9cc3e6;--text:#e8e6e1;--muted:#a3a8ad;--border:#363d44;--soft:#232c36;--soft2:#252b31;--info:#9cc9ea;--chk:#1d2e3d;--chkb:#3d6a94;--btn:#2a3138}
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:480px;margin:0 auto}
header{text-align:center;margin-bottom:12px}
header h1{font-size:1.2rem;margin:0 0 4px;color:var(--head)}
header p{font-size:.78rem;color:var(--muted);margin:0}
h2{font-size:1rem;margin:0 0 8px;color:var(--head)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.status-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.next-badge{background:var(--primary);color:#fff;padding:4px 10px;border-radius:999px;font-size:.85rem;font-weight:bold}
.stats-mini{font-size:.9rem;font-weight:bold;color:var(--head)}
.target-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.8rem}
.btn-group{display:flex;gap:6px}
button{cursor:pointer;border:1px solid var(--border);background:var(--btn);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:bold;transition:.15s}
button:active{transform:scale(.97)}
button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
button.danger{color:#c0392b;border-color:#e6b0aa}
button.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.canvas-wrap{position:relative;width:100%;aspect-ratio:1/1;background:#cbb89d;border-radius:10px;overflow:hidden;border:2px solid #a89478;touch-action:manipulation}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
.hint-text{font-size:.75rem;color:var(--muted);text-align:center;margin:6px 0 0}
.action-row{display:flex;gap:8px;margin-top:10px}
.action-row button{flex:1;padding:8px}
.video-row{display:flex;gap:8px;margin-top:8px}
.video-row button{flex:1;padding:10px 6px;font-size:.85rem}
.video-target{font-size:.75rem;color:var(--muted);text-align:center;margin:6px 0 0}
.diag-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.diag-header h2{margin:0}
.diag-summary{background:var(--soft);border-left:4px solid var(--primary);padding:10px;border-radius:6px;font-size:.88rem;margin-bottom:10px}
.diag-tag{display:inline-block;background:var(--accent);color:#fff;font-size:.75rem;font-weight:bold;padding:2px 8px;border-radius:4px;margin-bottom:4px}
.diag-tag.good{background:#2e7d32}
.check-list{margin:8px 0 0;padding:0;list-style:none}
.check-item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:.84rem;background:var(--soft2)}
.check-item label{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-weight:bold}
.check-advice{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);color:var(--info);font-size:.8rem;display:none}
.check-item.checked{background:var(--chk);border-color:var(--chkb)}
.check-item.checked .check-advice{display:block}
video{width:100%;max-height:260px;background:#000;border-radius:8px;display:none}
.speed-controls{display:none;justify-content:center;gap:6px;margin-top:8px}
.vinfo{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.history-list{max-height:320px;overflow-y:auto;font-size:.82rem}
.history-row{padding:8px 4px;border-bottom:1px solid var(--border)}
.history-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.history-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.history-btns button{padding:5px 9px;font-size:.76rem}
.hit-mark{font-weight:bold;color:#e0524f}
.miss-mark{font-weight:bold;color:var(--muted)}

</style>

  <div class="card">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const STORAGE_KEY='kyudo_proto_shots_v1';
const canvas=document.getElementById('targetCanvas');
const ctx=canvas.getContext('2d');
const CENTER=340, TARGET_R=145;
let targetType='kasumi', diagScope='recent', pendingShotId=null;
const STORE_KEY='kyudo_sessions_v2';
let sessFilter='all';
let histStand=null;
/* ユーザーが意図的に空のセッションを作ったかどうか（「＋ 新規セッション」や
   セッション切替で空セッションを選んだ場合に true。統合・復元で current を
   勝手に動かさないための印。ログイン・ユーザー切替で false に戻る） */
let userMadeEmptySession=false;
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return dstr(new Date());}
function dateOfId(id){const t=Number(String(id).split('_')[0]);return t>0?dstr(new Date(t)):todayStr();}
function newSess(date,type){return {id:'s'+Date.now()+Math.random().toString(36).slice(2,6),date:date||todayStr(),type:type||'practice',title:'',shots:[]};}
/* 端末内データのパース失敗時は、壊れた値を別キーに退避して警告する（無言で捨てないため） */
function safeParseStore(raw){
  try{return JSON.parse(raw);}
  catch(e){
    try{localStorage.setItem('kyudo_store_corrupt_'+Date.now(),raw);}catch(err){}
    try{alert('端末内の記録データが壊れていたため、新しい記録から始めます。壊れたデータは別に保存しました。');}catch(err){}
    return null;
  }
}
function loadStore(){
  try{
    const r=localStorage.getItem(STORE_KEY);
    if(r){
      const o=safeParseStore(r);
      if(o&&Array.isArray(o.sessions)&&o.sessions.length){
        /* 読み込み時に形状を検査する（壊れたセッションが端末内にあると、
           集計・描画・共有のあちこちで例外が起きるため） */
        const clean=o.sessions.map(sanitizeLocalSession);
        o.sessions.forEach((x,i)=>{if(!clean[i])quarantineBad('stored',x);});
        o.sessions=clean.filter(Boolean);
        if(o.sessions.length)return o;
      }
    }
    const old=localStorage.getItem(STORAGE_KEY);
    if(old){
      const a=safeParseStore(old);
      if(Array.isArray(a)&&a.length){
        const g={};
        a.forEach(s=>{if(!s||!s.id)return;const d=dateOfId(s.id);(g[d]=g[d]||[]).push(s);});
        const sessions=Object.keys(g).sort().map(d=>{
          const se=newSess(d,'practice');
          se.shots=g[d].map((s,i)=>Object.assign({},s,{stand:Math.floor(i/4)+1,arrowNum:(i%4)+1,arrowType:i%2===0?'甲矢':'乙矢'}));
          return se;
        });
        return {sessions,currentId:sessions[sessions.length-1].id};
      }
    }
  }catch(e){}
  const s=newSess();return {sessions:[s],currentId:s.id};
}
function curSession(){return store.sessions.find(s=>s.id===store.currentId)||store.sessions[0];}
let store=loadStore();
/* このタブが端末内データを最後に読み書きした時刻（別タブでの消去の検出用） */
let lastStoreSyncAt=Date.now();
{
  store.currentId=curSession().id;
  const cs=curSession();
  if(cs.date!==todayStr()&&cs.shots.length&&!cs.manualDate){const ns=newSess();store.sessions.push(ns);store.currentId=ns.id;}
  else if(cs.date!==todayStr()&&!cs.shots.length&&!cs.manualDate){cs.date=todayStr();}
}
let shots=curSession().shots;
const videoUrlMap={};

/* 動画はIndexedDB（端末内）に保存 */
let _db=null;
function dbOpen(){return new Promise(res=>{try{const r=indexedDB.open('kyudo_videos',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>res(null);}catch(e){res(null);}});}
function dbTx(mode,fn){return new Promise((res,rej)=>{if(!_db)return rej(new Error('nodb'));try{const t=_db.transaction('v',mode);const r=fn(t.objectStore('v'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}catch(e){rej(e);}});}
const dbPut=(k,b)=>dbTx('readwrite',s=>s.put(b,k));
const dbDel=k=>dbTx('readwrite',s=>s.delete(k)).catch(()=>{});
const dbClear=()=>dbTx('readwrite',s=>s.clear()).catch(()=>{});

function loadShots(){
  try{const r=localStorage.getItem(STORAGE_KEY);const a=r?JSON.parse(r):[];return Array.isArray(a)?a:[];}catch(e){return [];}
}
/* 他タブで保存された端末内データを、端末内の store と統合する
   （2タブ同時使用で、片方の記録がもう片方の保存で消えないようにするため）。
   同IDは端末内を優先。両方の deletedSessionIds も統合し、そのIDのセッションは両方から除く。
   persistStore() からは呼ばない（clearLocalUserData が persistStore() を呼ぶため、
   統合すると消したはずの記録が復活してしまう）。 */
function mergeStoreFromStorage(){
  let raw=null;
  try{raw=localStorage.getItem(STORE_KEY);}catch(e){}
  /* 消去マーカー：別タブでユーザー切替による消去があった場合、このタブの
     端末内データを統合で復活させず、保存内容をそのまま採用する */
  try{
    const mk=JSON.parse(localStorage.getItem('kyudo_store_cleared_v1')||'null');
    if(mk&&mk.at&&mk.at>lastStoreSyncAt){
      lastStoreSyncAt=Date.now();
      if(!raw)return false;
      const o=JSON.parse(raw);
      if(o&&Array.isArray(o.sessions)){
        const clean=o.sessions.map(sanitizeLocalSession);
        o.sessions.forEach((x,i)=>{if(!clean[i])quarantineBad('stored',x);});
        store.sessions=clean.filter(Boolean);
        if(!store.sessions.length)store.sessions.push(newSess());
        store.currentId=(o.currentId&&store.sessions.some(s=>s.id===o.currentId))?o.currentId:store.sessions[store.sessions.length-1].id;
        shots=curSession().shots;
        return true;
      }
      return false;
    }
  }catch(e){}
  if(!raw)return false;
  lastStoreSyncAt=Date.now();
  let o=null;
  try{o=JSON.parse(raw);}catch(e){return false;}
  if(!o||!Array.isArray(o.sessions)||!o.sessions.length)return false;
  let storedDeleted=new Set();
  try{storedDeleted=new Set(JSON.parse(localStorage.getItem(DELETED_KEY)||'[]'));}catch(e){}
  storedDeleted.forEach(id=>deletedSessionIds.add(id));
  const byId=new Map();
  let changed=false;
  store.sessions.forEach(s=>{
    const clean=sanitizeLocalSession(s);
    if(!clean){if(s&&s.id)changed=true;return;}
    if(deletedSessionIds.has(clean.id)){changed=true;return;}
    byId.set(clean.id,clean);
  });
  o.sessions.forEach(x=>{
    const clean=sanitizeLocalSession(x);
    if(!clean){quarantineBad('stored',x);return;}
    if(deletedSessionIds.has(clean.id))return;
    if(byId.has(clean.id))return;
    byId.set(clean.id,clean);changed=true;
  });
  if(changed){
    store.sessions=[...byId.values()];
    if(!store.sessions.length)store.sessions.push(newSess());
    if(!store.sessions.some(s=>s.id===store.currentId))store.currentId=store.sessions[store.sessions.length-1].id;
    shots=curSession().shots;
  }
  saveDeletedIds();
  return changed;
}
let storeSaveWarned=false;
function saveShots(){
  try{mergeStoreFromStorage();}catch(e){}
  try{localStorage.setItem(STORE_KEY,JSON.stringify(store));lastStoreSyncAt=Date.now();}
  catch(e){
    shareStatus='端末への保存に失敗しました。空き容量をご確認ください';
    if(!storeSaveWarned){storeSaveWarned=true;try{alert('記録を端末に保存できませんでした。空き容量をご確認ください。');}catch(err){}}
  }
  try{scheduleShare();}catch(e){}
}

function setTargetType(t){
  targetType=t;
  document.getElementById('btnKasumi').classList.toggle('active',t==='kasumi');
  document.getElementById('btnHoshi').classList.toggle('active',t==='hoshi');
  draw();
}
function setDiagScope(s){
  diagScope=s;
  document.getElementById('btnScopeRecent').classList.toggle('active',s==='recent');
  document.getElementById('btnScopeAll').classList.toggle('active',s==='all');
  document.getElementById('btnScopeTotal').classList.toggle('active',s==='total');
  updateDiagnosis();
}

function draw(){
  if(!ctx)return;
  ctx.clearRect(0,0,680,680);
  ctx.fillStyle='#cbb89d';ctx.fillRect(0,0,680,680);
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.setLineDash([8,8]);
  ctx.beginPath();
  ctx.moveTo(CENTER,20);ctx.lineTo(CENTER,660);ctx.moveTo(20,CENTER);ctx.lineTo(660,CENTER);ctx.stroke();
  ctx.beginPath();ctx.arc(CENTER,CENTER,TARGET_R*2,0,Math.PI*2);ctx.stroke();
  ctx.restore();

  ctx.fillStyle='rgba(50,40,30,0.65)';ctx.font='bold 24px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('▲ 上',CENTER,34);ctx.fillText('▼ 下',CENTER,646);
  ctx.textAlign='left';ctx.fillText('◀ 後ろ(左)',18,CENTER-22);
  ctx.textAlign='right';ctx.fillText('前(右) ▶',662,CENTER-22);

  ctx.beginPath();ctx.arc(CENTER+5,CENTER+6,TARGET_R,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fill();

  if(targetType==='kasumi'){
    [[18,'#1c1c1c'],[14.7,'#fff'],[11.7,'#1c1c1c'],[10.2,'#fff'],[7.2,'#1c1c1c'],[3.6,'#fff']].forEach(([cm,c])=>{
      ctx.beginPath();ctx.arc(CENTER,CENTER,TARGET_R*(cm/18),0,Math.PI*2);ctx.fillStyle=c;ctx.fill();
    });
  }else{
    ctx.beginPath();ctx.arc(CENTER,CENTER,TARGET_R,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(CENTER,CENTER,TARGET_R/3,0,Math.PI*2);ctx.fillStyle='#1c1c1c';ctx.fill();
  }
  ctx.beginPath();ctx.arc(CENTER,CENTER,TARGET_R,0,Math.PI*2);
  ctx.lineWidth=4;ctx.strokeStyle='#8b6f47';ctx.stroke();

  const rs=Math.max(0,shots.length-4);
  shots.forEach((s,idx)=>{
    const px=CENTER+s.nx*TARGET_R, py=CENTER-s.ny*TARGET_R;
    const recent=idx>=rs;
    ctx.save();
    ctx.globalAlpha=recent?1:0.35;
    ctx.beginPath();ctx.arc(px,py,recent?15:10,0,Math.PI*2);
    ctx.fillStyle=s.hit?'#d32f2f':'#1f3a52';ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
    if(recent){
      ctx.fillStyle='#fff';ctx.font='bold 17px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String((idx%4)+1),px,py+1);
    }
    ctx.restore();
  });
}

canvas.addEventListener('click',e=>{
  /* 日をまたいで開きっぱなしの場合：手動で日付を変えたセッションでなく、
     日付が今日でなく、射が1本以上あるときは、今日の新しいセッションを作ってから記録する */

  const r=canvas.getBoundingClientRect();
  const cx=(e.clientX-r.left)*canvas.width/r.width;
  const cy=(e.clientY-r.top)*canvas.height/r.height;
  const nx=(cx-CENTER)/TARGET_R, ny=(CENTER-cy)/TARGET_R;
  const dist=Math.hypot(nx,ny);
  const idx=shots.length, arrowNum=(idx%4)+1;

  shots.push({

});

function updateDiagnosis(){
  const c=document.getElementById('diagContainer');
  const pool=store.sessions.flatMap(x=>x.shots);
  if(!(diagScope==='total'?pool:shots).length){
    c.innerHTML='<div class="diag-summary">矢所を記録すると、偏りやバラつきから射癖の候補を診断します。</div>';
    return;
  }
  const ts=diagScope==='recent'?shots.slice(-4):(diagScope==='total'?pool:shots);
  const n=ts.length;
  const avgX=ts.reduce((a,b)=>a+b.nx,0)/n, avgY=ts.reduce((a,b)=>a+b.ny,0)/n;
  const avgDist=Math.hypot(avgX,avgY);
  const spread=ts.reduce((a,b)=>a+Math.hypot(b.nx-avgX,b.ny-avgY),0)/n;

  const haya=ts.filter(s=>s.arrowType==='甲矢'), otoya=ts.filter(s=>s.arrowType==='乙矢');
  let ho='',hoPlain='';
  if(haya.length&&otoya.length){
    const hX=haya.reduce((a,b)=>a+b.nx,0)/haya.length, oX=otoya.reduce((a,b)=>a+b.nx,0)/otoya.length;
    if(Math.abs(hX-oX)>=0.45){
      ho=`<div style="margin-top:6px;font-size:.8rem;color:#a569bd;">💡 <b>甲矢・乙矢の差：</b>甲矢は${hX>oX?'前(右)':'後ろ(左)'}、乙矢は${oX>hX?'前(右)':'後ろ(左)'}へ飛びやすい傾向があります（羽の回転方向や手の内の変化が影響しやすいです）。</div>`;
      hoPlain='甲矢は'+(hX>oX?'前(右)':'後ろ(左)')+'、乙矢は'+(oX>hX?'前(右)':'後ろ(左)')+'へ飛びやすい傾向があります';
    }
  }
  const dp=[];
  if(avgX>0.35)dp.push('前（右）');else if(avgX<-0.35)dp.push('後ろ（左）');
  if(avgY>0.35)dp.push('上');else if(avgY<-0.35)dp.push('下');
  const dirLabel=dp.length?dp.join('・'):'中心付近';
  const hitCount=ts.filter(s=>s.hit).length, allHit=hitCount===n;

  let checks=[],badge='',good=false;
  if(n>=2&&spread>0.75){
    badge='上下左右に散らばり傾向';
    checks=[
      {q:'毎射で矢束（引きの深さ）や会の長さが変わっていませんか？',a:'毎回同じ「会」の伸び合いを作り、3〜5秒の十分な保ちを意識しましょう。'},
      {q:'離れで馬手や弓手が緩んで（びくついて）いませんか？',a:'緩み離れは矢所が最も安定しません。左右の押し引きの張力を残したまま鋭く離れましょう。'},
      {q:'足踏みや胴造りの軸が前後左右にブレていませんか？',a:'腰・丹田に重心を落とし、真っ直ぐな軸の上で引くことを意識しましょう。'}
    ];
  }else if(avgDist<=0.35&&spread<=0.5){
    badge='非常に安定（芯に集中）';good=true;
    checks=[{q:'現在の良い感覚（手の内・引き分け・伸び合い）を言語化できていますか？',a:'今の「中る感覚」をメモや動画で残しておくと、調子を崩した時の基準になります！'}];
  }else{
    badge=`${dirLabel}への偏り${allHit?'（中っているが癖の予兆）':''}`;
    if(avgX>0.35)checks.push(
      {q:'角見（つのみ）が効かず、弓返りが弱くなっていませんか？',a:'大三から会にかけて小指・薬指・中指を締め、親指の付け根（拇指球）で的の中心を押す意識を持ちましょう。'},
      {q:'離れで弓手（左手）が的側に緩んだり、馬手（右手）が手先で離れていませんか？',a:'押手が負けると矢は前に飛びます。矢筋に沿って真っ直ぐ押し切る意識を持ちましょう。'},
      {q:'物見（顔の向き）が浅く、前狙いになっていませんか？',a:'顎を引き、しっかり的を見ることで狙いのズレを防げます。'});
    if(avgX<-0.35)checks.push(
      {q:'上押し（親指側の上向きの力）が強すぎませんか？',a:'弓手を上にこじると矢は後ろへ飛びます。平押し（水平の押し）を意識しましょう。'},
      {q:'引きすぎ、または引き分けで弓手が早く降りてしまっていませんか？',a:'左右均等のリズムで引き分け、頬付け・口割りの位置が後ろに流れすぎないよう確認しましょう。'},
      {q:'右肘が背後に十分回らず、手先で引いていませんか？',a:'肩甲骨を寄せるように引き収め、矢筋の延長線上に右肘を収めましょう。'});
    if(avgY>0.35)checks.push(
      {q:'弓手の肩（肩根）が上がっていませんか？',a:'打起し〜引き分けで肩を落とし、肩甲骨を下げる意識（肩を沈める）を持ちましょう。'},
      {q:'口割りが高くなっていたり、離れで弓手を上に跳ね上げていませんか？',a:'口割りは口角の高さに保ち、離れで左拳が上に跳ねないよう的の中心に向かって押しましょう。'});
    if(avgY<-0.35)checks.push(
      {q:'引き分けが浅く、矢束が不足していませんか？（早気含む）',a:'会での伸び合いが足りないと矢勢が落ちて下に外れます。矢尺いっぱいまで引き切りましょう。'},
      {q:'離れで弓手が下がる（押しが下に抜ける）癖がありませんか？',a:'離れの瞬間に左腕が下がらないよう、的の高さを維持したまま押し切りましょう。'});
  }
  const ch=checks.map((x,i)=>`<li class="check-item" id="chkItem_${i}"><label><input type="checkbox" onchange="toggleCheck(${i},this.checked)" /><span>${x.q}</span></label><div class="check-advice">✅ <b>対策ポイント：</b>${x.a}</div></li>`).join('');
  c.innerHTML=`<div class="diag-summary"><span class="diag-tag ${good?'good':''}">${badge}</span><br>対象 ${n}本（的中 ${hitCount}本）の矢所を分析しました。${allHit&&!good?'<br><span style="color:#e0524f;">※すべて中っていますが、的の端に偏っているため大会や距離変化で外れやすいサインです。</span>':''}${ho}</div><div style="font-size:.82rem;font-weight:bold;color:var(--muted);">▼ 当てはまる項目にチェックして原因を絞り込む：</div><ul class="check-list">${ch}</ul>`;
  /* AI版：診断結果を構造化して残す（AIへのプロンプト用）。判定バッジが
     変わったときはチェック項目の意味も変わるため、チェックをリセットする。 */
  if(!lastDiag||lastDiag.badge!==badge)diagChecked=[];
  lastDiag={scope:diagScope,n:n,hit:hitCount,allHit:allHit,badge:badge,good:good,dirLabel:dirLabel,avgX:Math.round(avgX*100)/100,avgY:Math.round(avgY*100)/100,avgDist:Math.round(avgDist*100)/100,spread:Math.round(spread*100)/100,ho:hoPlain,checks:checks.map(x=>({q:x.q,a:x.a}))};
}
function toggleCheck(i,v){const el=document.getElementById('chkItem_'+i);if(el)el.classList.toggle('checked',v);if(v){if(!diagChecked.includes(i))diagChecked.push(i);}else{diagChecked=diagChecked.filter(x=>x!==i);}}

/* ---- AI分析（AI版のみ） ---- */
/* Firebase AI Logic（Gemini）で診断結果を分析する。実際の Gemini 呼び出しは
   末尾のモジュールスクリプトが window.__geminiGenerate に設定する（App Check 付き）。
   テスト用に window.__aiGenerate があればそちらを優先する。 */
const AI_MODEL='gemini-3.5-flash-lite'; /* 軽量モデル。gemini-2.0-flash は 2026-06-01 に廃止のため使わない */
const AI_LAST_KEY='kyudo_ai_last_date_v1';
const AI_HIST_KEY='kyudo_ai_history_v1';
const AI_HIST_MAX=10;

/* ---- AI分析の有料プラン（月額500円・税込） ---- */
/* 課金状態は Firestore の members ドキュメントの subscription フィールドで持つ
   （{plan:'ai', status:'active', currentPeriodEnd:<ミリ秒>, stripeCustomerId:<id>}）。
   サーバー（Stripe Webhook）が書く値なので、doShare / flushOldUserData /
   shareFallbackOnce の書き込みペイロードには subscription を含めないこと。
   adoptMembersDoc も subscription を消したり上書きしたりしない。
   aiSubscriptionActive() は members[myId].subscription を都度読む。 */
const AI_PAYWALL_ENABLED=false; /* 有料化するまでは false（AI分析は誰でも使える）。有料化するときは true にする */
const STRIPE_CHECKOUT_URL=''; /* Stripe で作った決済リンク（Payment Links）またはサーバーの /create-checkout-session の URL を貼る */
const STRIPE_PORTAL_URL=''; /* Stripe Billing Portal またはサーバーの /portal の URL を貼る */
function aiSubscriptionActive(){
  if(!AI_PAYWALL_ENABLED)return true; /* 有料化前：課金状態に関わらず AI分析を使える */
  try{
    const s=members&&myId&&members[myId]?members[myId].subscription:null;
    return !!(s&&s.status==='active'&&typeof s.currentPeriodEnd==='number'&&s.currentPeriodEnd>Date.now());
  }catch(e){return false;}
}
function aiPaywallHtml(){
  const checkout=STRIPE_CHECKOUT_URL?`<div class='sess-row' style='margin-top:8px'><a href='${esc(STRIPE_CHECKOUT_URL)}' target='_blank' rel='noopener' class='pri' style='display:inline-block;text-decoration:none;padding:8px 14px;border-radius:8px'>月額500円（税込）でAI分析をはじめる</a></div>`:`<p class='hint-text' style='text-align:left'><b>決済リンクは準備中です</b></p>`;
  const portal=STRIPE_PORTAL_URL?`<p class='hint-text' style='text-align:left'><a href='${esc(STRIPE_PORTAL_URL)}' target='_blank' rel='noopener'>プランの管理・解約はこちら</a></p>`:'';
  return `<div class='diag-summary' style='white-space:pre-wrap'>AI分析は月額500円（税込）の有料プランです。決済するとすぐに使えます。</div>${checkout}${portal}<p class='hint-text' style='text-align:left'>すでに課金済みの方は、反映まで数分かかる場合があります。</p>`;
}
let lastDiag=null;      /* updateDiagnosis() が入れる構造化された診断結果 */
let diagChecked=[];     /* ユーザーがチェックした原因項目の index */
let aiCurrentText='',aiCurrentNote='',aiBusy=false,aiHistOpen=-1;
function aiTodayStr(){return dstr(new Date());}
function aiLastDate(){try{return localStorage.getItem(AI_LAST_KEY)||'';}catch(e){return '';}}
function aiSetLastDate(d){try{localStorage.setItem(AI_LAST_KEY,d);}catch(e){}}
function loadAiHistory(){try{const a=JSON.parse(localStorage.getItem(AI_HIST_KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x==='object'):[];}catch(e){return [];}}
function saveAiHistory(en){try{const a=loadAiHistory();a.unshift(en);localStorage.setItem(AI_HIST_KEY,JSON.stringify(a.slice(0,AI_HIST_MAX)));}catch(e){}}
function deleteAiHist(i){try{const a=loadAiHistory();a.splice(i,1);localStorage.setItem(AI_HIST_KEY,JSON.stringify(a));}catch(e){}if(aiHistOpen===i)aiHistOpen=-1;renderAiBox();}
function toggleAiHist(i){aiHistOpen=(aiHistOpen===i?-1:i);renderAiBox();}
function aiTrendSummary(){
  try{

    const days=bucketsOf(sess,'day','all').slice(-7).map(b=>b.key.slice(5)+' '+b.h+'/'+b.n).join('、');
    return '通算 '+tot.h+'/'+tot.n+'本（'+tot.p+'%）。練習 '+pr.h+'/'+pr.n+'本（'+pr.p+'%）、試合 '+ma.h+'/'+ma.n+'本（'+ma.p+'%）。直近7日：'+(days||'なし');

  ];
  return lines.join('\n');

async function callGemini(prompt){
  if(typeof window.__aiGenerate==='function')return await window.__aiGenerate(prompt);
  if(typeof window.__geminiGenerate==='function')return await window.__geminiGenerate(prompt);
  const e=new Error('ai-not-configured');e.code='ai-not-configured';throw e;
}
function aiErrorMessage(e){
  const c=(e&&e.code)||'';
  const m=String((e&&e.message)||'');
  if(c==='ai-not-configured')return 'AI分析の設定がまだ完了していません。READMEの手順で Firebase コンソールの設定（AI Logic の有効化とサイトキーの貼り付け）を確認してください。';
  if(c==='resource-exhausted'||/429/.test(m))return 'AIの利用回数の上限に達しました。明日もう一度お試しください。';
  if(c==='failed-precondition'||c==='permission-denied'||/API has not been used|not enabled|PERMISSION_DENIED/i.test(m))return 'AIの利用設定がまだ完了していません。READMEの手順で Firebase コンソールの設定を確認してください。';
  if(/network|fetch|Failed to fetch/i.test(m))return '通信に失敗しました。時間をおいて再度お試しください。';
  return 'AI分析に失敗しました。時間をおいて再度お試しください。';
}
async function runAiAnalysis(){
  if(aiBusy)return;
  const box=document.getElementById('aiBox');if(!box)return;
  /* 有料プランが有効でないときは AI を呼ばず、有料プランの案内を表示する */
  if(!aiSubscriptionActive()){aiCurrentText='';aiCurrentNote='';renderAiBox();return;}
  const today=aiTodayStr();
  const hist=loadAiHistory();
  if(aiLastDate()===today&&hist.length){
    aiCurrentText=hist[0].text;aiCurrentNote='今日はもう分析済みです。最新の結果を表示しています。';
    renderAiBox();return;
  }
  if(!lastDiag||!lastDiag.n){
    aiCurrentText='';aiCurrentNote='まず的をタップして1本以上記録してください。';
    renderAiBox();return;
  }
  aiBusy=true;aiCurrentNote='AIが分析しています…';aiCurrentText='';renderAiBox();
  try{
    const prompt=buildAiPrompt();
    const text=await callGemini(prompt);
    const t=String(text||'').trim();
    if(!t)throw new Error('empty');
    aiCurrentText=t;aiCurrentNote='';
    saveAiHistory({at:Date.now(),date:today,scope:lastDiag.scope,badge:lastDiag.badge||'',text:t});
    aiSetLastDate(today);
  }catch(e){
    aiCurrentText='';aiCurrentNote=aiErrorMessage(e);
  }
  aiBusy=false;renderAiBox();
}

  }).join('');
  box.innerHTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)'>
    <div class='sess-row'><span style='font-size:.88rem;font-weight:bold'>🤖 AI分析</span><button class='pri' id='aiBtn' onclick='runAiAnalysis()' ${aiBusy?'disabled':''}>AI分析する</button></div>
    <p class='hint-text' style='text-align:left'>診断結果と的中率の推移をAIが分析します。1日1回まで。名前・メールは送られません。</p>

/* ---- 期間ごとの集計（年・月・週・日） ---- */
function bucketKey(date,per){
  if(typeof date!=='string')return '';
  if(per==='year')return date.slice(0,4);
  if(per==='month')return date.slice(0,7);
  if(per==='day')return date;
  const d=new Date(date+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d);
}
function bucketLabel(k,per){
  if(per==='year')return k+'年';
  if(per==='month')return k.slice(0,4)+'年'+Number(k.slice(5))+'月';
  const md=k.slice(0,4)+'/'+Number(k.slice(5,7))+'/'+Number(k.slice(8,10));
  return per==='week'?md+'〜の週':md;
}
function shortLabel(k,per){
  if(per==='year')return k+'年';
  if(per==='month')return Number(k.slice(5))+'月';
  return Number(k.slice(5,7))+'/'+Number(k.slice(8,10));
}
function buckets(per,type){return bucketsOf(store.sessions,per,type);}
function bucketsOf(sessions,per,type){
  const map={};
  sessions.forEach(s=>{
    /* 形状の壊れたセッションは集計から外す（date が無いと bucketKey で例外になるため） */
    if(!s||typeof s.date!=='string'||!Array.isArray(s.shots))return;
    if(type!=='all'&&s.type!==type)return;
    const k=bucketKey(s.date,per);
    const b=map[k]||(map[k]={key:k,n:0,h:0,kai:0});
    s.shots.forEach(x=>{if(!x)return;b.n++;if(x.hit)b.h++;});
    for(let i=0;i+4<=s.shots.length;i+=4){if(s.shots.slice(i,i+4).every(x=>x&&x.hit))b.kai++;}
  });
  return Object.values(map).filter(b=>b.n>0).sort((a,b)=>a.key.localeCompare(b.key));
}
const pct=b=>Math.round(b.h/b.n*100);

let myId=null,dbCap=null,userCap=null,members={},memStatus='',shareStatus='',membersFirst=false;

let consent=null;
const OWNER_KEY='kyudo_owner_uid_v1';
/* 端末内の記録だけを保存する（共有は送らない） */

/* 端末内のユーザー別データをすべて消す。違うユーザーでログインしたときに呼ぶ。
   共有より先に消すので、前の人のデータが新しい人の Firestore に混ざらない。 */
function clearLocalUserData(){
  const s=newSess();store.sessions=[s];store.currentId=s.id;shots=s.shots;
  Object.keys(videoUrlMap).forEach(k=>{try{URL.revokeObjectURL(videoUrlMap[k]);}catch(e){}delete videoUrlMap[k];});
  myTeams=[];myName='';profile={};localTeams=[];localRoster={};consent=null;

  seenRemoteIds=new Set();deletedSessionIds=new Set();
  userMadeEmptySession=false;shareRetries=0;lastShareError='';
  try{localStorage.removeItem(SEEN_KEY);localStorage.removeItem(DELETED_KEY);}catch(e){}
  /* 別タブに「消去された」ことを知らせる印を残す（このタブの保存で消した記録が復活しないようにするため） */
  try{localStorage.setItem('kyudo_store_cleared_v1',JSON.stringify({at:Date.now()}));}catch(e){}
  persistStore();saveLocalTeams();
  shareMode='all';
  try{localStorage.setItem('kyudo_share','all');}catch(e){}
}
/* ユーザー切替の前に、前のユーザーの端末内データを Firestore に送る。
   送れなかった記録が、切替時の消去で失われないようにするため。
   送れなくても消去は進める（消さないと前の人のデータが新しい人に混ざるため）。
   戻り値：true=送れた、false=送れなかった（退避キーへ逃がす）、'deleted'=削除済み（墓標）のため送らない（退避もしない）。 */
async function flushOldUserData(prevUid){
  if(!dbCap||!prevUid)return false;
  /* 別タブで記録された分も含め、端末内の最新状態を統合してから送る */
  try{mergeStoreFromStorage();}catch(e){}
  /* await の前に必要な値をローカル変数へ退避する（この間に消去が走っても空値を書かないため） */
  const fMode=shareMode,fTeams=myTeams.slice(),fName=myName||'',fProfile=Object.assign({},profile),fRoster=Object.assign({},localRoster),fConsent=consent?Object.assign({},consent):null;
  try{
    /* 切替時はトリミングせず全量送る（古い記録が消えないようにするため） */
    const {ss}=compactSessions(Number.POSITIVE_INFINITY);
    const ref=dbCap.doc('members/'+prevUid);
    const snap=await ref.get();
    const r=snap&&snap.exists?snap.data():null;
    /* 削除済み（墓標）のドキュメントには書き込まない */
    if(r&&r.deleted)return 'deleted';
    /* 共有先のセッションと和集合にする（端末内だけで置き換えると、
       他端末で共有された記録が共有先から消えてしまうため） */
    const remote=(r&&Array.isArray(r.sessions))?r.sessions:[];
    const keep=unionSessions(ss,remote);
    await ref.set({v:2,mode:fMode,teams:fTeams,name:fName,profile:fProfile,roster:fRoster,consent:fConsent,updated:Date.now(),sessions:keep},{merge:true});
    return true;
  }catch(e){return false;}
}
/* 切替時に共有できなかった記録の退避先（kyudo_backup_{uid}）があれば、
   セッションだけ端末内に戻して共有し直す（名前・プロフィール・チーム・名簿・同意は復元しない）。
   退避キーは1件以上復元できたときだけ消す（復元できなかった場合は次回ログインで再試行する）。 */
function restoreBackup(uid){
  if(!uid)return 0;
  /* 削除済み（墓標）のユーザーは復元しない（退避キーは残し、墓標が解除されたら復元する） */
  const md=members&&members[uid];
  if(md&&md.deleted)return 0;
  let raw=null;
  try{raw=localStorage.getItem('kyudo_backup_'+uid);}catch(e){}
  if(!raw)return 0;
  let n=0;
  try{
    const o=JSON.parse(raw);
    const arr=o&&Array.isArray(o.sessions)?o.sessions:null;
    if(arr){
      const byId=new Map(store.sessions.map(s=>[s.id,s]));
      arr.forEach(x=>{
        const clean=sanitizeLocalSession(x);
        if(!clean){quarantineBad('backup',x);return;}
        if(deletedSessionIds.has(clean.id))return;
        if(byId.has(clean.id))return;
        byId.set(clean.id,clean);n++;
        /* 復元したセッションは prune の対象から外す（次のスナップショットで
           また消えてしまうため。第3回監査で確定した消失メカニズムの対策） */
        seenRemoteIds.delete(clean.id);
      });
      if(n){
        store.sessions=[...byId.values()];shots=curSession().shots;persistStore();saveSeenIds();
        /* 復元で記録が増え、現在のセッションが空なら、最新の記録があるセッションを開く */
        adoptLatestSessionIfCurrentEmpty();
      }
    }
  }catch(e){}
  if(n>0){try{localStorage.removeItem('kyudo_backup_'+uid);}catch(e){}}
  if(n){try{alert('バックアップから'+n+'件の記録を復元しました。数秒後に共有されます。');}catch(e){}try{scheduleShare();}catch(e){}}
  return n;
}
/* ログイン中のユーザーが前回と違う Google ユーザーなら、端末内のデータを消す。
   匿名→Google の連携（uid が変わらない場合）は引き継がれる。 */
let authSwitching=false,authSwitchingUid=null,pendingAuthUser=null;
async function noteAuthUser(u){
  if(!u){authReady=true;updateTeamBar();return;}
  if(u.isAnonymous){myId=u.uid;authReady=true;updateTeamBar();return;}
  /* 処理中に別ユーザーの切替が来たら、最新の一件をキューして後で実行する
     （捨てると、myId だけ新ユーザーになり旧ユーザーの記録が混ざるため）。
     同一 uid の再入（同じサインインで2回走る場合）だけ捨てる。 */
  if(authSwitching){
    if(u.uid===authSwitchingUid)return;
    pendingAuthUser=u;
    return;
  }
  authSwitching=true;authSwitchingUid=u.uid;
  let err=null;
  try{
    let prev=null;try{prev=localStorage.getItem(OWNER_KEY);}catch(e){}
    const hasLocalData=!!(myName||myTeams.length||(store&&store.sessions.some(s=>s.shots&&s.shots.length)));
    if(prev&&prev!==u.uid){
      const ok=await flushOldUserData(prev);
      /* 送れなかった場合は端末内データを別キーに退避してから消す
         （墓標のユーザーは送るものがないため退避しない） */
      if(ok===false){try{localStorage.setItem('kyudo_backup_'+prev,JSON.stringify({name:myName,profile:profile,teams:myTeams,roster:localRoster,consent:consent,sessions:store.sessions,savedAt:Date.now()}));}catch(e){}}
      clearLocalUserData();updateTeamBar();renderStats();renderAll();updateAuthBar();
    }else if(!prev&&hasLocalData){
      /* OWNER_KEY が無いのに端末内データがある：消す前に無名の退避キーへ逃がす
         （前のユーザーが分からないため、uid 付きの退避キーにはできない） */
      try{localStorage.setItem('kyudo_backup_unknown_'+Date.now(),JSON.stringify({name:myName,profile:profile,teams:myTeams,roster:localRoster,consent:consent,sessions:store.sessions,savedAt:Date.now()}));}catch(e){}
      clearLocalUserData();updateTeamBar();renderStats();renderAll();updateAuthBar();
    }
    try{localStorage.setItem(OWNER_KEY,u.uid);}catch(e){}
    /* myId は消去が終わってから更新する（更新が先だと、端末内の旧ユーザーの
       記録が新ユーザーの共有先に混ざるため） */
    myId=u.uid;
    /* 切替時に共有できなかった記録の退避先があれば、このユーザー分を復元する */
    restoreBackup(u.uid);
    /* 認証が確定したのでバーを表示してよい（チームバーもここで描き直す） */
    authReady=true;updateTeamBar();
  }catch(e){err=e;}
  finally{authSwitching=false;authSwitchingUid=null;}
  if(pendingAuthUser){const p=pendingAuthUser;pendingAuthUser=null;await noteAuthUser(p);}
  if(err)throw err;
}

/* 動画以外のデータはすべて Firestore に保存する（端末内は読み込み用の控え）。
   共有モードは「すべて共有」「試合のみ」の2択。「共有しない」はない。 */
let shareMode='all',shareTimer=null,lastShared=null,sharing=false,rtok=0,shareRetries=0,lastShareError='';
try{shareMode=localStorage.getItem('kyudo_share')||'all';if(shareMode!=='all')shareMode='all';}catch(e){}

/* 共有先で見たセッションID（削除の伝播判定用）と、この端末で削除したセッションID。
   seen は「共有先にあったID」、deleted は「この端末で削除したID」。
   ユーザー切替時は両方クリアする（clearLocalUserData で行う）。 */
const SEEN_KEY='kyudo_seen_sessions_v1',DELETED_KEY='kyudo_deleted_sessions_v1';
let seenRemoteIds=new Set(),deletedSessionIds=new Set();
try{seenRemoteIds=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'));}catch(e){}
try{deletedSessionIds=new Set(JSON.parse(localStorage.getItem(DELETED_KEY)||'[]'));}catch(e){}
function saveSeenIds(){try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenRemoteIds].slice(-500)));}catch(e){}}
function saveDeletedIds(){try{localStorage.setItem(DELETED_KEY,JSON.stringify([...deletedSessionIds].slice(-200)));}catch(e){}}
/* 容量の都合で共有対象から外したセッションID（prune の対象から外すため永続化する） */
const TRIMMED_KEY='kyudo_trimmed_sessions_v1';
let trimmedIds=new Set();
try{trimmedIds=new Set(JSON.parse(localStorage.getItem(TRIMMED_KEY)||'[]'));}catch(e){}
function saveTrimmedIds(){try{localStorage.setItem(TRIMMED_KEY,JSON.stringify([...trimmedIds].slice(-500)));}catch(e){}}
function markSessionDeleted(id){if(!id)return;deletedSessionIds.add(id);saveDeletedIds();}
/* 共有で落ちた射のメタデータを、セッション内の順序から再計算する */
function rebuildShotMeta(shots){
  return (shots||[]).map((a,i)=>({nx:a.nx,ny:a.ny,hit:!!a.hit,dist:Number(Math.hypot(a.nx||0,a.ny||0).toFixed(3)),stand:Math.floor(i/4)+1,arrowNum:(i%4)+1,arrowType:(i%2===0?'甲矢':'乙矢')}));
}
/* 形状の壊れたセッションを共有・統合・復元で弾くための検査と退避。
   壊れた値があると compactSessions などで例外が起き、共有が毎回失敗する
   ため、見つけたら別キーに逃がして警告を出し、正常なものだけを通す。 */
function isValidLocalSession(x){return !!x&&typeof x.id==='string'&&typeof x.date==='string'&&Array.isArray(x.shots);}
function isValidCompactSession(x){return !!x&&typeof x.id==='string'&&(x.s===undefined||Array.isArray(x.s));}
/* 共有形式の射を浄化して {x,y,h} の配列に正規化する。
   新形式は map の配列（Firestore が受け入れる形）。旧形式 [nx,ny,hit]
   の配列も読み側は受け入れる（書き側は新形式だけを出す）。
   s が配列でない場合は [] を返す（呼び出し側で例外にならないため）。
   NaN / Infinity は Firestore が拒否するため弾く。 */
function sanitizeCompactShots(s){
  if(!Array.isArray(s))return [];
  const out=[];
  s.forEach(a=>{
    if(Array.isArray(a)){
      if(a.length>=2&&typeof a[0]==='number'&&typeof a[1]==='number'&&Number.isFinite(a[0])&&Number.isFinite(a[1]))out.push({x:a[0],y:a[1],h:a[2]?1:0});
    }else if(a&&typeof a==='object'){
      if(typeof a.x==='number'&&typeof a.y==='number'&&Number.isFinite(a.x)&&Number.isFinite(a.y))out.push({x:a.x,y:a.y,h:a.h?1:0});
    }
  });
  return out;
}
function sanitizeLocalSession(x){
  if(!isValidLocalSession(x))return null;
  return Object.assign({},x,{type:(typeof x.type==='string'?x.type:'practice'),title:(typeof x.title==='string'?x.title:''),shots:x.shots.filter(h=>h&&Number.isFinite(h.nx)&&Number.isFinite(h.ny))});
}
function quarantineBad(kind,v){
  try{console.warn('quarantined malformed session',kind,v);}catch(e){}
  try{
    const k='kyudo_bad_sessions_v1';
    let arr=[];try{arr=JSON.parse(localStorage.getItem(k)||'[]');}catch(e){}
    if(!Array.isArray(arr))arr=[];
    let sample='';try{sample=JSON.stringify(v).slice(0,200);}catch(e){}
    arr.push({kind:kind,at:Date.now(),id:(v&&v.id)||null,sample:sample});
    localStorage.setItem(k,JSON.stringify(arr.slice(-20)));
  }catch(e){}
}
/* 現在のセッションが空で、他に射のあるセッションがある場合、最新の射あり
   セッションを current にする（統合・復元直後のみ。ユーザーが意図的に空の
   セッションを作った直後は動かさない）。 */
function adoptLatestSessionIfCurrentEmpty(){
  if(userMadeEmptySession)return false;
  const cs=curSession();
  if(!cs||(cs.shots&&cs.shots.length))return false;
  const withShots=store.sessions.filter(s=>s&&s.shots&&s.shots.length);
  if(!withShots.length)return false;
  const latest=withShots.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.id||'').localeCompare(b.id||'')).pop();
  store.currentId=latest.id;shots=latest.shots;histStand=null;
  persistStore();
  return true;
}
/* 共有先のセッションを端末内に統合する（IDで和集合。同IDはローカル優先。
   日付のないセッションは取り込まない。この端末で削除したものは復活させない）。 */
function mergeRemoteIntoLocal(remoteSessions){
  if(!Array.isArray(remoteSessions))return false;
  const byId=new Map(store.sessions.map(s=>[s.id,s]));
  let changed=false;
  remoteSessions.forEach(x=>{
    if(!x||typeof x.id!=='string'){quarantineBad('remote',x);return;}
    /* s が配列でない共有先セッションは取り込まない（読むときに例外になるため）。
       seen にも加えない（prune の誤認を防ぐため） */
    if(x.s!==undefined&&!Array.isArray(x.s)){quarantineBad('remote',x);return;}
    seenRemoteIds.add(x.id);
    /* 共有先に戻ってきたセッションはトリミング扱いをやめる */
    trimmedIds.delete(x.id);
    if(!x.d)return;
    if(typeof x.d!=='string'){quarantineBad('remote',x);return;}
    if(deletedSessionIds.has(x.id))return;
    if(byId.has(x.id))return;
    const cleanShots=sanitizeCompactShots(x.s);
    byId.set(x.id,{id:x.id,date:x.d,type:(typeof x.t==='string'?x.t:'practice'),title:(typeof x.ti==='string'?x.ti:''),shots:rebuildShotMeta(cleanShots.map(a=>({nx:a.x,ny:a.y,hit:!!a.h})))});
    changed=true;
  });
  saveSeenIds();
  saveTrimmedIds();
  if(!store.sessions.length)store.sessions.push(newSess());
  if(changed){
    store.sessions=[...byId.values()];store.currentId=curSession().id;shots=curSession().shots;persistStore();
    /* 統合で記録が増え、現在のセッションが空なら、最新の記録があるセッションを開く */
    adoptLatestSessionIfCurrentEmpty();
  }
  return changed;
}
/* 共有先で見たことがあるのに今の共有先に無いローカルセッションを削除する
   （他端末での削除をこの端末にも伝える。共有したことのない記録は消さない）。 */
function pruneLocalDeletedByRemote(remoteSessions){
  if(!Array.isArray(remoteSessions))return false;
  const remoteIds=new Set(remoteSessions.map(x=>x&&x.id).filter(Boolean));
  let changed=false;
  store.sessions=store.sessions.filter(s=>{
    /* トリミングで共有対象から外れただけの記録は「削除」とみなさない */
    if(trimmedIds.has(s.id))return true;
    if(seenRemoteIds.has(s.id)&&!remoteIds.has(s.id)){changed=true;return false;}
    return true;
  });
  if(!store.sessions.length)store.sessions.push(newSess());
  if(changed){store.currentId=curSession().id;shots=curSession().shots;persistStore();}
  return changed;
}
function compactSessions(maxBytes){
  const r=x=>Math.round(x*100)/100;
  const cap=(typeof maxBytes==='number')?maxBytes:900000;
  /* 形状の壊れたセッションは共有対象から外す（shots が配列でない・date が
     ないものがあると、ここで例外が起きて共有が毎回失敗するため） */
  const ss=store.sessions.filter(x=>{
    if(!isValidLocalSession(x)){quarantineBad('local',x);return false;}
    return x.shots.length&&(shareMode==='all'||x.type==='match');
  })
    .sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))
    .map(x=>({id:x.id,d:x.date,t:(typeof x.type==='string'?x.type:'practice'),ti:String(x.title||'').slice(0,40),s:x.shots.filter(h=>h&&Number.isFinite(h.nx)&&Number.isFinite(h.ny)).map(h=>({x:r(h.nx),y:r(h.ny),h:h.hit?1:0}))}));
  let trimmed=false;
  while(ss.length>1&&JSON.stringify(ss).length>cap){const t=ss.shift();if(t&&t.id)trimmedIds.add(t.id);trimmed=true;}
  if(trimmed)saveTrimmedIds();
  return {ss,trimmed};
}
function scheduleShare(){
  if(!dbCap||!myId)return;
  /* 新しい共有トリガー（タップ・スナップショット・回線復帰）では再送回数を
     リセットする。3回失敗したあとでも、次のきっかけで再送が再開する。 */
  shareRetries=0;
  clearTimeout(shareTimer);shareTimer=setTimeout(doShare,1500);
}
/* 共有の差分判定キー（doShare とフォールバックで共通。同じ内容なら書き込まない） */
function shareKey(keep,wConsent){return shareMode+'|'+(myName||'')+'|'+JSON.stringify(profile)+'|'+myTeams.join(',')+'|'+JSON.stringify(localRoster)+'|'+JSON.stringify(wConsent||null)+'|'+JSON.stringify(keep);}
/* ローカルと共有先のセッションを ID で和集合にする（ローカル優先）。
   書き戻しで共有先の記録を消さないための共通処理。
   形状の壊れたもの（id が無い・s が配列でない）は入れない。 */
function unionSessions(localSs,remoteSs){
  const byId=new Map();
  const add=x=>{
    if(!isValidCompactSession(x))return;
    if(byId.has(x.id))return;
    byId.set(x.id,Array.isArray(x.s)?Object.assign({},x,{s:sanitizeCompactShots(x.s)}):x);
  };
  (localSs||[]).forEach(add);
  (remoteSs||[]).forEach(add);
  return [...byId.values()].filter(x=>x&&!deletedSessionIds.has(x.id));
}
let sharePromise=null;
async function doShare(){
  if(sharing){scheduleShare();return sharePromise;}
  /* 初回スナップショットがまだ届いていない間は書かない。
     届く前に空の記録で上書きして、Firestore 側の記録を消すのを防ぐため。
     ただし捨てずにやり直す（捨てると、その記録が共有されないままになるため）。 */
  if(!membersFirst){scheduleShare();return;}
  sharing=true;
  sharePromise=(async()=>{
    try{
      /* 試行の始めに「共有中」に戻す（古い失敗文言が残り続けないようにするため） */
      shareStatus='共有中';
      const ref=dbCap.doc('members/'+myId),r=members[myId];
      /* 削除済みのドキュメント（墓標）には書き込まない */
      if(r&&r.deleted){shareStatus='共有は停止中です（データ削除済み）。再度同意すると共有が再開します';return;}
      /* 書く直前に共有先の最新セッションと統合する（他端末の記録を消さないため） */
      const remoteSessions=(r&&Array.isArray(r.sessions))?r.sessions:[];
      mergeRemoteIntoLocal(remoteSessions);
      pruneLocalDeletedByRemote(remoteSessions);
      const {ss,trimmed}=compactSessions();
      shareStatus=ss.length?(trimmed?'共有中（容量の都合で古い記録は共有されていません）':'共有中'):'共有できる記録がまだありません';
      /* 共有先の同意がローカルより新しい場合は、古いローカル同意で書き戻さない */
      const wConsent=(consent&&r&&r.consent&&(r.consent.at||0)>(consent.at||0))?r.consent:consent;
      /* 共有先のセッションと和集合にする（取り込めない日付なしセッションも含め、
         共有先にある記録を書き戻しで消さないため） */
      const keep=unionSessions(ss,remoteSessions);
      const key=shareKey(keep,wConsent);
      if(lastShared===null&&r&&((r.mode||'all')+'|'+(r.name||'')+'|'+JSON.stringify(r.profile||{})+'|'+(r.teams||[]).join(',')+'|'+JSON.stringify(r.roster||{})+'|'+JSON.stringify(r.consent||null)+'|'+JSON.stringify(r.sessions||[]))===key)lastShared=key;
      /* merge:true で書く：プロフィールや設定済みの印を消さないため */
      if(key!==lastShared){await ref.set({v:2,mode:shareMode,teams:myTeams,name:myName||'',profile:profile,roster:localRoster,consent:wConsent||null,updated:Date.now(),sessions:keep},{merge:true});lastShared=key;}
      shareRetries=0;lastShareError='';
    }catch(e){
      /* 失敗の理由を残す（画面だけでは原因が分からないため。コードは
         管理者診断にも出す）。permission-denied / invalid-argument だけ
         文言を分け、それ以外はコードを併記する。 */
      const code=(e&&e.code)||'';
      lastShareError=code||((e&&e.message)||String(e));
      try{console.error('doShare failed',code,lastShareError);}catch(_){}
      shareStatus=(code==='permission-denied')?'共有できません：Firestoreのルール（firestore.rules）を適用してください':((code==='invalid-argument')?'共有できません：共有するデータの形式に問題があります':('共有に失敗しました'+(code?'（'+code+'）':'')+'。時間をおいて再度お試しください'));
      /* 書き込み失敗時は指数バックオフで再送する（最大3回） */
      if(shareRetries<3){const d=[5000,15000,45000][shareRetries];shareRetries++;clearTimeout(shareTimer);shareTimer=setTimeout(doShare,d);}
    }
  })();
  try{await sharePromise;}finally{sharing=false;sharePromise=null;}
  rerender();
}
function setShare(m){
  /* 共有は常にON（すべて共有）。「試合のみ」「共有しない」にはできない。 */
  m='all';
  shareMode=m;
  try{localStorage.setItem('kyudo_share',m);}catch(e){}
  lastShared=null;shareStatus='';lastShareError='';scheduleShare();renderStats();
}
/* 回線復帰時は保留中の共有を送り直す。
   タブを隠す・閉じるときの共有はやめた（完了が保証されないタイミングで
   呼ぶと、失敗文言だけが残るため。ログアウト時・次回ログイン時の送り出し
   が安全網としてある）。 */
window.addEventListener('online',()=>{scheduleShare();});
/* 共有の状態を一般ユーザーにも分かるように記録ページの上部に出す。
   「共有先にまだ接続できていません」はスナップショットが10秒届かないときに
   memStatus として立ち、ここで表示される。診断の「共有先 0件」は
   スナップショット未到達でも 0件と表示されるため、ここでは接続状態で区別する。 */
function updateShareStatusLine(){
  const el=document.getElementById('shareStatusLine');if(!el)return;
  let msg='';
  if(dbCap&&myId&&memStatus)msg=memStatus;
  else if(dbCap&&myId&&shareStatus&&(/失敗|できません|停止中|容量の都合/.test(shareStatus)))msg=shareStatus;
  el.textContent=msg;
  el.style.display=msg?'block':'none';
}
/* スナップショットが一定時間届かないときのフォールバック：doc.get() で既存
   ドキュメントを確認し、端末内を正として一度だけ書き込む。
   共有先の記録と和集合にするので、空で上書きして消すことはない。 */
let shareFallbackDone=false;
async function shareFallbackOnce(){
  if(shareFallbackDone||membersFirst||!dbCap||!myId)return;
  try{
    const ref=dbCap.doc('members/'+myId);
    const snap=await ref.get();
    /* get の間にスナップショットが届いたら、通常の共有に任せる */
    if(membersFirst)return;
    const r=snap&&snap.exists?snap.data():null;
    if(r&&r.deleted)return;
    const remote=(r&&Array.isArray(r.sessions))?r.sessions:[];
    const {ss}=compactSessions();
    if(!ss.length){shareFallbackDone=true;return;}
    const keep=unionSessions(ss,remote);
    const wConsent=(consent&&r&&r.consent&&(r.consent.at||0)>(consent.at||0))?r.consent:consent;
    await ref.set({v:2,mode:shareMode,teams:myTeams,name:myName||'',profile:profile,roster:localRoster,consent:wConsent||null,updated:Date.now(),sessions:keep},{merge:true});
    /* 成功したら doShare と同じキーを入れて、次の doShare の冗長な書き込みを防ぐ */
    lastShared=shareKey(keep,wConsent);
    shareFallbackDone=true;
    shareStatus='共有しました';
  }catch(e){
    /* 失敗したら次回再試行できるように印を戻し、理由を残す */
    shareFallbackDone=false;
    lastShareError=(e&&e.code)||((e&&e.message)||String(e));
    try{console.error('shareFallback failed',e&&e.code,e&&e.message);}catch(_){}
    shareStatus='共有先に接続できませんでした。時間をおいて再度お試しください';
  }
  rerender();
}
function rerender(){updateShareStatusLine();if(document.body.dataset.pg==='rec'){try{renderAll();}catch(e){}}else renderStats();}

/* ---- Firebase Firestore ----
   データ設計（このアプリの既存の形そのまま）：
   teams/{teamId}   {name, code, owner, created}
   members/{userId} {v:2, mode, teams:[teamId], name, updated, sessions:[{id,d,t,ti,s:[{x,y,h},...]}]}
   ※ s は map の配列にする（配列の中に配列を入れると Firestore が
      invalid-argument で拒否するため。旧形式 [nx,ny,hit] の配列は読む側だけ受け入れる）。
   Firestoreの DocumentReference / CollectionReference は、
   既存コードが期待する doc()/collection()/onSnapshot()/where().get() と
   同じ形なので、dbCap に firebase.firestore() をそのまま渡せる。
   ログインは Google アカウント必須。匿名ログインは使わない。
   未ログイン（または旧バージョンの匿名ユーザー）のときは
   ログインゲートがアプリを覆い、Googleでログインするまで使えない。
   匿名で使っていた端末で Google ログインすると、匿名アカウントに
   Google が連携されるので、ログイン前の記録・チームは同じuidのまま引き継がれる。
   config は Firebaseコンソールで発行されるものを、この端末の localStorage にだけ保存する。 */
let firebaseConfig=null,firebaseStatus='',firebaseProject='';
/* 公開用：ここに firebaseConfig を入れておくと、開いた人全員が
   貼り付けなしで Firestore に接続できる。入れない場合（null）は、
   従来どおり各端末の「🔥 Firebaseで共有する」欄から設定する。
   ※ Firebaseのウェブ用 apiKey は公開用の識別子で、パスワードではない。
   データの保護は Firestoreのルールと匿名ログインで行う。 */
const DEFAULT_FIREBASE_CONFIG={apiKey:"AIzaSyCGbqDOr7Ta_Oi6xRMP-85rioaK7RF4rA8",authDomain:"kyudo-app-e13ad.firebaseapp.com",projectId:"kyudo-app-e13ad",storageBucket:"kyudo-app-e13ad.firebasestorage.app",messagingSenderId:"914246347318",appId:"1:914246347318:web:d006f9d3e61128ea750697",measurementId:"G-XTLG1Y1TZC"};
// 例：const DEFAULT_FIREBASE_CONFIG={apiKey:"...",authDomain:"....firebaseapp.com",projectId:"...",storageBucket:"....appspot.com",messagingSenderId:"...",appId:"1:...:web:..."};
try{firebaseConfig=JSON.parse(localStorage.getItem('kyudo_firebase_config_v1')||'null');}catch(e){firebaseConfig=null;}

function saveFirebaseConfigFromInput(){
  const el=document.getElementById('fbConfigInput');
  const raw=((el&&el.value)||'').trim();
  if(!raw){firebaseStatus='設定（firebaseConfig）を貼り付けてください';renderStats();return;}
  let c=null,err='';
  try{
    /* JSONそのままでも、const firebaseConfig = {...}; の形でも読めるように、
       最初の { から最後の } までを抜き出してから解析する */
    const s=raw.indexOf('{'),e2=raw.lastIndexOf('}');
    if(s<0||e2<=s)throw new Error('no object');
    c=JSON.parse(raw.slice(s,e2+1));
    if(!c.apiKey||!c.projectId)throw new Error('apiKey / projectId がありません');
  }catch(e){
    err=e&&e.message?e.message:String(e);
    /* 末尾が切れていたり、全体がJSONとして読めなくても、
       項目ごとに抜き出せれば接続できる（apiKey と projectId が必須） */
    const pick=k=>{const m=raw.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));return m?m[1]:'';};
    const byField={apiKey:pick('apiKey'),authDomain:pick('authDomain'),projectId:pick('projectId'),storageBucket:pick('storageBucket'),messagingSenderId:pick('messagingSenderId'),appId:pick('appId'),measurementId:pick('measurementId')};
    if(byField.apiKey&&byField.projectId){
      c={};Object.keys(byField).forEach(k=>{if(byField[k])c[k]=byField[k];});
    }else{
      const missing=['apiKey','projectId'].filter(k=>!byField[k]);
      firebaseStatus='設定を読み取れませんでした。見つからなかった項目：'+missing.join('、')+'。firebaseConfig の apiKey と projectId の行が貼れているか確認してください。';
      renderStats();return;
    }
  }
  try{
    localStorage.setItem('kyudo_firebase_config_v1',JSON.stringify(c));
    location.reload();
  }catch(e){firebaseStatus='設定を読み取れませんでした（'+err+'）。apiKey / projectId を含む firebaseConfig の全体が貼れているか確認してください';renderStats();}
}

  try{localStorage.removeItem('kyudo_firebase_config_v1');}catch(e){}
  location.reload();
}

let authMsg='';
function googleProvider(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p;}

  }

async function loginWithGoogle(){
  if(typeof firebase==='undefined'||!dbCap){authMsg='まずFirebaseに接続してください';updateAuthBar();return;}
  try{
    const auth=firebase.auth(),cur=auth.currentUser;
    if(cur&&cur.isAnonymous){
      try{await cur.linkWithPopup(googleProvider());}
      catch(e){
        if(e&&e.code==='auth/credential-already-in-use'&&e.credential){await auth.signInWithCredential(e.credential);}
        else if(e&&e.code==='auth/popup-blocked'){await cur.linkWithRedirect(googleProvider());return;}
        else throw e;
      }
    }else{
      try{await auth.signInWithPopup(googleProvider());}
      catch(e){if(e&&e.code==='auth/popup-blocked'){await auth.signInWithRedirect(googleProvider());return;}throw e;}
    }
    updateAuthBar();
    location.reload();
  }catch(e){
    authMsg='Googleログインできませんでした：'+((e&&e.message)||e)+'（FirebaseコンソールでGoogleログインを有効にしたか確認してください）';
    updateAuthBar();
  }
}

/* Firestore の自分のドキュメントを端末内に取り込む（初回スナップショット時）。
   プロフィール・同意・名簿・チーム・記録を読み込み、端末内の記録と統合する
   （IDで重複を除く）。別の端末でつけた記録がここで読み込まれる。 */
function adoptMembersDoc(){
  const m=members[myId];
  if(!m)return;
  /* 墓標（削除済み）のドキュメント：他端末で削除された場合、この端末の
     端末内データも消す（未共有記録は退避キーへ逃がしてから消す）。
     再同意すれば墓標は解除され、退避した記録は復元される。 */
  if(m.deleted){
    const hasData=!!(myName||myTeams.length||(store&&store.sessions.some(s=>s.shots&&s.shots.length)));
    if(hasData){
      try{localStorage.setItem('kyudo_backup_'+myId,JSON.stringify({name:myName,profile:profile,teams:myTeams,roster:localRoster,consent:consent,sessions:store.sessions,savedAt:Date.now()}));}catch(e){}
      const keepMembers=members;
      clearLocalUserData();
      members=keepMembers;members[myId]=m;membersFirst=true;
      updateTeamBar();renderStats();renderAll();updateAuthBar();
    }
    return;
  }
  /* 共有は常にON（すべて共有）。Firestore 側が「試合のみ」でも「すべて共有」に移行する。 */
  shareMode='all';
  /* プロフィールは項目ごとに統合：ローカルにだけあるアイコンは残す。
     ただし端末内で編集中（共有される前）の新しい値を、古い共有先の値で上書きしない */
  if(m.profile&&!(profileUpdatedAt>(m.updated||0))){
    const oldIcon=profile.icon;
    profile=Object.assign({},m.profile);
    if(!profile.icon&&oldIcon)profile.icon=oldIcon;
  }
  /* Firestore の名前を正とする（別端末で変えた名前もここで反映される）。
     ただし端末内で編集中の新しい名前を、古い共有先の名前で上書きしない */
  if(m.name&&!(nameUpdatedAt>(m.updated||0)))myName=m.name;
  /* 同意は共有先のほうが新しい場合だけ取り込む */
  if(m.consent&&(!consent||(m.consent.at||0)>(consent.at||0)))consent=m.consent;
  if(m.onboarded)obDone=true;
  /* 名簿：共有先にあるチームの名簿で置き換え、ローカル専用チームの名簿は残す */
  if(m.roster&&typeof m.roster==='object'&&!Array.isArray(m.roster)){
    const next={};
    Object.keys(localRoster).forEach(t=>{if(String(t).indexOf('lt')===0)next[t]=localRoster[t];});
    Object.keys(m.roster).forEach(t=>{next[t]=m.roster[t];});
    localRoster=next;
  }
  if(Array.isArray(m.sessions)){
    mergeRemoteIntoLocal(m.sessions);
    pruneLocalDeletedByRemote(m.sessions);
  }
  if(Array.isArray(m.teams)){
    /* チームは共有先を正とし、ローカル専用チーム（lt始まり）だけ残す */
    const localOnly=myTeams.filter(id=>String(id).indexOf('lt')===0);
    myTeams=Array.from(new Set([].concat(m.teams,localOnly)));
    if(st.team&&st.team!=='all'&&!myTeams.includes(st.team))st.team='all';
  }
  saveLocalTeams();
  updateAuthBar();updateTeamBar();loadTeams();
}
/* メンバー同期は一度だけ開始する（認証が遅れて届いた場合の二重開始を防ぐ） */
let membersSyncStarted=false;
function startMembersSync(){
  if(membersSyncStarted)return;
  membersSyncStarted=true;
  const timer=setTimeout(()=>{memStatus='共有先にまだ接続できていません。記録はこの端末に保存されています。';rerender();},10000);
  const fbTimer=setTimeout(()=>{shareFallbackOnce();},15000);
  dbCap.collection('members').onSnapshot(snap=>{
    clearTimeout(timer);clearTimeout(fbTimer);memStatus='';members={};
    snap.docs.forEach(d=>{members[d.id]=d.data();});
    /* スナップショットが届くたびに立てる（ユーザー切替で clearLocalUserData が
       false に戻しても、次のスナップショットで復活させるため。初回だけだと
       リロードなしの切替後に共有が永久に止まる） */
    membersFirst=true;
    /* 初回だけでなく毎回、共有先の最新データを取り込む（他端末の記録・名前・チームも反映される） */
    adoptMembersDoc();
    restoreBackup(myId);
    scheduleShare();
    checkOnboarding();
    rerender();
  },()=>{clearTimeout(timer);memStatus='共有先に接続できませんでした。記録はこの端末に保存されています。';rerender();});
}
async function initFirebase(){
  try{
    if(typeof firebase==='undefined'){authReady=true;updateTeamBar();updateAuthBar();return false;}
    const cfg=loadFirebaseConfig();
    if(!cfg){authReady=true;updateTeamBar();updateAuthBar();return false;}
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    /* AI版：末尾のモジュールスクリプトが Firebase AI Logic を
       初期化するための設定。compat SDK とは別のアプリとして初期化する。 */
    window.__FIREBASE_CONFIG__=cfg;
    firebaseProject=cfg.projectId||'';
    const auth=firebase.auth();
    try{await auth.getRedirectResult();}catch(e){authMsg='Googleログインできませんでした：'+((e&&e.message)||e);}
    auth.onAuthStateChanged(async u=>{if(u){await noteAuthUser(u);if(u.displayName&&!myName){myName=u.displayName;saveLocalTeams();}updateAuthBar();if(!u.isAnonymous)startMembersSync();}});
    dbCap=firebase.firestore();
    userCap={
      id:async()=>auth.currentUser?auth.currentUser.uid:'',
      profiles:async(ids)=>{
        const out={};
        for(const id of ids){
          try{
            const d=await dbCap.doc('members/'+id).get();
            if(d.exists&&d.data()&&d.data().name)out[id]={name:d.data().name};
          }catch(e){}
        }
        return out;
      }
    };
    const user=auth.currentUser;
    if(!user){
      /* 未ログイン：匿名では入らず、ログインゲートを表示する */
      firebaseStatus='Googleでログインしてください';
      updateAuthBar();
      return true;
    }
    /* myId は noteAuthUser の中で、消去が終わってから設定される */
    await noteAuthUser(user);
    if(user.displayName&&!myName){myName=user.displayName;saveLocalTeams();}
    firebaseStatus='Firebase Firestore（'+firebaseProject+'）に接続中';
    if(!user.isAnonymous)startMembersSync();
    updateAuthBar();
    return true;
  }catch(e){
    firebaseStatus='Firebaseに接続できませんでした：'+((e&&e.message)||e)+'（configを確認してください）';
    authReady=true;updateTeamBar();updateAuthBar();
    return false;
  }
}

function allSessionsOf(uid){
  if(uid===myId||uid==='me')return store.sessions;
  const m=members[uid];
  if(!m||!Array.isArray(m.sessions))return [];
  /* 共有先の s は sanitize を通して読む（s が配列でない真値や旧形式の
     配列でも例外にならないようにするため。日付なしは bucketsOf 側で弾く） */
  return m.sessions.filter(x=>x&&typeof x==='object').map(x=>({id:x.id,date:x.d,type:x.t,title:x.ti||'',shots:sanitizeCompactShots(x.s).map(a=>({nx:a.x,ny:a.y,hit:!!a.h}))}));
}
/* チーム tid のメンバーID一覧（'all' は共有中の全員）。自分は常に含む。 */
function teamNow(){return (st.team&&(st.team==='all'||myTeams.includes(st.team)))?st.team:(myTeams[0]||'all');}
function teamMemberIds(tid){
  const ids=[myId||'me'];
  Object.keys(members).forEach(id=>{
    if(id===myId)return;
    const m=members[id];
    if(!m||m.deleted)return;
    if(tid!=='all'&&!(Array.isArray(m.teams)&&m.teams.includes(tid)))return;
    ids.push(id);
  });
  return ids;
}
function participants(){return teamMemberIds(teamNow());}
/* 指定メンバーの順位行（期間 sel・種類 st.type で集計し、並び順でソート） */
function rankRowsFor(ids,per,sel){
  /* 記録がない人もランキングに残す（0本・記録なしで最下位に並べる） */
  const rows=ids.map(id=>({id,b:bucketsOf(allSessionsOf(id),per,st.type).find(x=>x.key===sel)}));
  const rk=r=>r.b?r.b.h/r.b.n:0;
  rows.sort((a,b)=>{
    if(!!a.b!==!!b.b)return a.b?-1:1;
    if(!a.b)return 0;
    return st.sort==='rate'?((b.b.n>=4)-(a.b.n>=4))||rk(b)-rk(a)||b.b.h-a.b.h:b.b.h-a.b.h||rk(b)-rk(a);
  });
  return rows;
}

function iconImg(uid,s){

async function handleIconFile(file,ctx){
  if(!file)return;
  try{
    const url=URL.createObjectURL(file);
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
    const s=128,cv=document.createElement('canvas');cv.width=s;cv.height=s;
    const c=cv.getContext('2d');
    const w=img.naturalWidth,h=img.naturalHeight,side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)/2;
    c.drawImage(img,sx,sy,side,side,0,0,s,s);
    URL.revokeObjectURL(url);
    const data=cv.toDataURL('image/jpeg',0.85);
    if(ctx==='onboard'){obProfile.icon=data;renderOnboard();}
    else{profile.icon=data;profileUpdatedAt=Date.now();saveLocalTeams();scheduleShare();updateAuthBar();renderProfilePage();}
  }catch(e){
    if(ctx==='onboard'){obMsg='画像を読み込めませんでした';renderOnboard();}
    else{profileMsg='画像を読み込めませんでした';renderProfilePage();}
  }
}

function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(6);
  (window.crypto||{getRandomValues:x=>x.forEach((_,i)=>{x[i]=Math.floor(Math.random()*4294967296);})}).getRandomValues(a);
  return Array.from(a,v=>c[v%c.length]).join('');
}

/* チームの仲間の名前一覧（Firestoreの members から）。
   自分の記録がまだFirestoreに無い場合は、自分の表示名も入れる。 */
function teamMemberNames(id){
  const seen={},out=[];
  Object.keys(members).forEach(mid=>{
    const m=members[mid];
    if(m&&Array.isArray(m.teams)&&m.teams.includes(id)){seen[mid]=1;out.push({id:mid,name:mid===myId?(myName||m.name||'あなた'):(m.name||'メンバー')});}
  });
  if(myTeams.includes(id)&&!seen[myId])out.unshift({id:myId,name:myName||'あなた'});
  return out;
}

async function names(ids){

  const out={};

  });

}

function chartSvg(series,per){
  const keys=[...new Set(series.flatMap(x=>x.b.map(b=>b.key)))].sort().slice(-12);
  const W=320,H=150,L=28,R=10,T=16,B=26,pw=W-L-R,ph=H-T-B;
  const xs=i=>keys.length===1?L+pw/2:L+pw*i/(keys.length-1),ys=p=>T+ph*(1-p/100);
  let svg=`<svg viewBox='0 0 ${W} ${H}' width='100%' role='img' aria-label='的中率の推移'>`;
  [0,50,100].forEach(p=>{svg+=`<line class='gl' x1='${L}' x2='${W-R}' y1='${ys(p)}' y2='${ys(p)}'/><text class='tx' x='${L-4}' y='${ys(p)+3}' text-anchor='end'>${p}</text>`;});
  series.forEach(x=>{
    const pts=keys.map((k,i)=>{const b=x.b.find(y=>y.key===k);return b?[xs(i),ys(pct(b)),pct(b)]:null;}).filter(Boolean);
    svg+=`<polyline class='ln${x.cls}' points='${pts.map(q=>q[0]+','+q[1]).join(' ')}'/>`;
    pts.forEach(q=>{svg+=`<circle class='dt${x.cls}' cx='${q[0]}' cy='${q[1]}' r='3.5'/>`;if(series.length===1)svg+=`<text class='tx' x='${q[0]}' y='${q[1]-7}' text-anchor='middle'>${q[2]}</text>`;});
  });
  keys.forEach((k,i)=>{if(keys.length<=8||i%2===0)svg+=`<text class='tx' x='${xs(i)}' y='${H-8}' text-anchor='middle'>${shortLabel(k,per)}</text>`;});
  return svg+'</svg>';
}
function dayBody(all,sess){
  const days=all.map(b=>b.key).reverse();
  const day=days.includes(st.day)?st.day:days[0];
  const ss=(sess||store.sessions).filter(x=>x.date===day&&(st.ttype==='all'||x.type===st.ttype)).sort((a,b)=>a.id.localeCompare(b.id));
  const stands=[];
  ss.forEach(x=>{for(let i=0;i<x.shots.length;i+=4){const g=x.shots.slice(i,i+4);stands.push({h:g.filter(y=>y.hit).length,n:g.length});}});
  const W=320,H=160,L=28,R=10,T=18,B=28,pw=W-L-R,ph=H-T-B,m=Math.max(stands.length,1),cw=pw/m;
  const ys=p=>T+ph*(1-p/100);
  let svg=`<svg viewBox='0 0 ${W} ${H}' width='100%' role='img' aria-label='一日の的中推移'>`;
  [0,50,100].forEach(p=>{svg+=`<line class='gl' x1='${L}' x2='${W-R}' y1='${ys(p)}' y2='${ys(p)}'/><text class='tx' x='${L-4}' y='${ys(p)+3}' text-anchor='end'>${p}</text>`;});
  let ch=0,cn=0;const pts=[];
  stands.forEach((x,i)=>{
    ch+=x.h;cn+=x.n;
    const cx=L+cw*i+cw/2,bw=Math.min(cw*0.6,32),bh=ph*(x.h/x.n),cp=Math.round(ch/cn*100);
    svg+=`<rect class='bar' x='${cx-bw/2}' y='${T+ph-bh}' width='${bw}' height='${bh}' rx='2'/><text class='tx' x='${cx}' y='${T+ph-bh-3}' text-anchor='middle'>${x.h}/${x.n}</text>`;
    if(m<=10||i%2===0)svg+=`<text class='tx' x='${cx}' y='${H-10}' text-anchor='middle'>${i+1}立</text>`;
    pts.push([cx,ys(cp),cp]);
  });
  svg+=`<polyline class='ln2' points='${pts.map(q=>q[0]+','+q[1]).join(' ')}'/>`;
  pts.forEach(q=>{svg+=`<circle class='dt2' cx='${q[0]}' cy='${q[1]}' r='3'/>`;});
  svg+='</svg>';
  const tn=stands.reduce((a,x)=>a+x.n,0),th=stands.reduce((a,x)=>a+x.h,0),kai=stands.filter(x=>x.n===4&&x.h===4).length;
  return `<h2 style='margin:4px 0 6px'>🕐 ${bucketLabel(day,'day')} の一日の推移</h2>
  <div class='sess-row'><span style='font-size:.82rem'>日付：</span><select data-k='day'>${days.map(k=>`<option value='${k}' ${k===day?'selected':''}>${bucketLabel(k,'day')}</option>`).join('')}</select></div>
  <div class='diag-summary'>${stands.length}立 ${th}/${tn}本（${tn?Math.round(th/tn*100):0}%）／皆中 ${kai}回</div>${svg}
  <div class='legend'><span style='color:var(--chkb)'>■</span> 立ごとの的中　<span style='color:#d98e04'>●</span> 累積的中率（%）</div><h2 style='margin:12px 0 6px'>📅 日ごとの推移</h2>`;
}
function trendBody(){
  /* 推移はランキングと期間・種別を共有しない（st.tper/st.ttype）。
     表示する人は st.tmember（未選択＝自分）。 */
  const per=st.tper,type=st.ttype;
  const ids=teamMemberIds('all');
  const uid=(st.tmember&&ids.includes(st.tmember))?st.tmember:(myId||'me');
  const sess=allSessionsOf(uid);
  const all=bucketsOf(sess,per,type);
  if(!all.length)return `<p class='hint-text'>該当する記録がありません</p>`;
  const tot=all.reduce((a,b)=>({n:a.n+b.n,h:a.h+b.h,kai:a.kai+b.kai}),{n:0,h:0,kai:0});
  const rows=all.slice().reverse().map(b=>`<tr><td>${bucketLabel(b.key,per)}</td><td>${b.h}/${b.n}</td><td>${pct(b)}%</td><td>${b.kai}</td></tr>`).join('');
  return (per==='day'?dayBody(all,sess):'')+`<div class='diag-summary'>合計 ${tot.h}/${tot.n}本（${pct(tot)}%）／皆中 ${tot.kai}回</div>${chartSvg([{b:all,cls:''}],per)}<p class='hint-text'>的中率（%）・直近${Math.min(12,all.length)}期間</p><div class='history-list'><table class='tbl'><tr><th>期間</th><th>的中</th><th>的中率</th><th>皆中</th></tr>${rows}</table></div>`;
}

/* ---- ランキング（メンバー比較） ---- */
async function rankBody(){
  await loadTeams();
  const per=st.per,t=teamNow(),ids=participants(),keys=periodKeys(per,st.type,ids);
  const tname=t==='all'?'全体':((teamInfo[t]&&teamInfo[t].name)||'チーム');
  const teamSel=myTeams.length?`<div class='sess-row'><span style='font-size:.82rem'>チーム：</span><select data-k='team'><option value='all' ${t==='all'?'selected':''}>すべて（共有中の全員）</option>${myTeams.map(id=>`<option value='${id}' ${id===t?'selected':''}>${esc((teamInfo[id]&&teamInfo[id].name)||'チーム')}</option>`).join('')}</select></div>`:'';
  const sortTabs=`<div class='btn-group tabs' style='margin-bottom:8px'>${tabs('sort',SORTS)}</div>`;
  const rosterIds=t==='all'?myTeams:([t]);
  const rosterList=rosterIds.flatMap(tid=>(localRoster[tid]||[]).map(m=>({tid:tid,m:m})));
  const rosterRows=rosterList.map(x=>`<div class='rank-row'><div class='rank-no'>—</div><div class='rank-main'>${esc(x.m.name)}<div class='vtag'>${esc((teamInfo[x.tid]&&teamInfo[x.tid].name)||'チーム')}　記録なし</div></div><div class='rank-val'>—<div class='vtag'>名簿のみ</div></div></div>`).join('');
  const rosterBlock=rosterRows?`<h2 style='margin:14px 0 4px'>👥 チーム名簿（記録なし）</h2>`+rosterRows:'';
  /* 空の理由でメッセージを分ける。期間・種別で絞って0件の場合は、
     期間・種別のタブ（renderRankPage の head 側）は残っているので、切り替えて確認できる。 */
  if(!keys.length){
    const anySess=ids.some(id=>allSessionsOf(id).some(s=>s.shots&&s.shots.length));
    if(anySess)return teamSel+sortTabs+`<p class='hint-text'>この期間・種別には記録がありません。上の期間や種別を変えてみてください。</p>`+rosterBlock;
    return teamSel+sortTabs+`<p class='hint-text'>該当する記録がありません。メニュー →「チーム」でチームを作り、名簿に部員を追加できます。</p>`+rosterBlock;
  }
  const sel=keys.includes(st.sel)?st.sel:keys[0];
  const nm=await names(teamMemberIds('all'));
  const rows=rankRowsFor(ids,per,sel);
  const tot=rows.reduce((a,r)=>r.b?{n:a.n+r.b.n,h:a.h+r.b.h,kai:a.kai+r.b.kai}:a,{n:0,h:0,kai:0});
  const list=rows.map((r,i)=>rankRowHtml(r,i,nm)).join('');
  const note=ids.length<2?`<p class='hint-text'>${t==='all'?'共有しているメンバーがまだいません。':'このチームで記録を共有しているメンバーがまだいません。'}${isAdmin()?'チーム画面の「メンバーと共有」をオンにして、仲間にも共有してもらいましょう。':''}</p>`:`<p class='hint-text'>${ids.length}人で比較中（タップでその人の記録を表示）</p>`;
  /* 所属チームごとのランキング（各チームのメンバー順位） */
  const teamBlocks=myTeams.map(tid=>{
    const tn=(teamInfo[tid]&&teamInfo[tid].name)||'チーム';
    const trows=rankRowsFor(teamMemberIds(tid),per,sel);
    return `<h2 style='margin:14px 0 4px'>🏷 ${esc(tn)}</h2>`+(trows.length?trows.map((r,i)=>rankRowHtml(r,i,nm)).join(''):`<p class='hint-text'>この期間の記録がありません</p>`);
  }).join('');
  /* 団体ランキング（チーム同士を平均的中率で比較）。記録ゼロのチームも0本・—%で表示する。 */
  const medals=['🥇','🥈','🥉'];
  const trank=myTeams.map(tid=>{
    let n=0,h=0,kai=0;
    teamMemberIds(tid).forEach(id=>{const b=bucketsOf(allSessionsOf(id),per,st.type).find(x=>x.key===sel);if(b){n+=b.n;h+=b.h;kai+=b.kai;}});
    return {tid,n,h,kai};
  }).sort((a,b)=>{const ra=a.n?a.h/a.n:-1,rb=b.n?b.h/b.n:-1;return rb-ra||b.h-a.h;});
  const teamRankBlock=trank.length?trank.map((x,i)=>{
    const tn=(teamInfo[x.tid]&&teamInfo[x.tid].name)||'チーム';
    return `<div class='rank-row'><div class='rank-no'>${x.n?(medals[i]||(i+1)+'位'):(i+1)+'位'}</div><div class='rank-main'>${esc(tn)}<div class='bar-track'><div class='bar-fill' style='width:${x.n?Math.round(x.h/x.n*100):0}%'></div></div><div class='vtag'>${x.h}/${x.n}本　皆中 ${x.kai}回</div></div><div class='rank-val'>${x.n?Math.round(x.h/x.n*100)+'%':'—%'}</div></div>`;
  }).join(''):'';
  const bestRows=bucketsOf(store.sessions,per,st.type).filter(b=>b.n>=4).sort((a,b)=>b.h/b.n-a.h/a.n||b.h-a.h).slice(0,5)
    .map((b,i)=>`<div class='rank-row'><div class='rank-no'>${i+1}位</div><div class='rank-main'>${bucketLabel(b.key,per)}</div><div class='rank-val'>${pct(b)}%<div class='vtag'>${b.h}/${b.n}</div></div></div>`).join('');
  return teamSel+sortTabs+`<div class='sess-row'><span style='font-size:.82rem'>対象期間：</span><select data-k='sel'>${keys.map(k=>`<option value='${k}' ${k===sel?'selected':''}>${bucketLabel(k,per)}</option>`).join('')}</select></div>`
    +`<div class='diag-summary'>${esc(tname)}　合計 ${tot.h}/${tot.n}本（${pct(tot)}%）／皆中 ${tot.kai}回／${rows.length}人</div>`+list+rosterBlock+note
    +(myTeams.length?`<h2 style='margin:14px 0 4px'>👥 所属チームのランキング</h2>`+teamBlocks:'')
    +(teamRankBlock?`<h2 style='margin:14px 0 4px'>🏆 団体ランキング</h2>`+teamRankBlock:'')
    +(bestRows?`<h2 style='margin:14px 0 4px'>🥇 自分のベスト期間</h2>`+bestRows:'');
}
async function memberBody(uid){
  const per=st.per,isMe=(uid===myId||uid==='me');
  const nm=await names([uid,myId||'me']);
  /* ランキングで選んだ期間（st.sel）があるときは、その期間の記録だけを一覧・合計の対象にする */
  const selKey=st.sel||null;
  /* 日付のないセッションは期間の絞り込み・一覧表示で例外になるため対象から外す */
  const inSel=x=>typeof x.date==='string'&&(!selKey||bucketKey(x.date,per)===selKey);
  const theirS=allSessionsOf(uid).filter(x=>(st.type==='all'||x.type===st.type)&&inSel(x));
  const theirs=bucketsOf(theirS,per,st.type),mine=bucketsOf(store.sessions.filter(x=>(st.type==='all'||x.type===st.type)&&inSel(x)),per,st.type);
  const name=esc(nm[uid]||'メンバー');
  const sess=theirS.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const tot=theirs.reduce((a,b)=>({n:a.n+b.n,h:a.h+b.h,kai:a.kai+b.kai}),{n:0,h:0,kai:0});
  const sumLabel=selKey?bucketLabel(selKey,per)+'の記録':(per==='year'?'年':per==='month'?'月':per==='week'?'週':'日')+'別の推移';
  const series=isMe?[{b:theirs,cls:''}]:[{b:mine,cls:'2'},{b:theirs,cls:''}];
  const rows=sess.map(x=>{
    const sr=rate(x.shots),stands=[];
    for(let i=0;i<x.shots.length;i+=4){const g=x.shots.slice(i,i+4);stands.push(`<div>第${i/4+1}立　${g.map(y=>y.hit?'◯':'×').join(' ')}　<b>${g.filter(y=>y.hit).length}/${g.length}</b></div>`);}
    return `<div class='history-row'><div class='history-top'><div><b>${x.date.replace(/-/g,'/')}</b> <span class='mode-badge${x.type==='match'?' match':''}'>${x.type==='match'?'🏆 試合':'🏹 練習'}</span> ${esc(x.title||'')}</div><span class='vtag'>${sr.h}/${sr.n}（${sr.p}%）</span></div><div style='font-size:.82rem;margin-top:4px'>${stands.join('')}</div></div>`;
  }).join('');
  const legend=isMe?'':`<div class='legend'><span style='color:#d98e04'>●</span> あなた　<span style='color:var(--head)'>●</span> ${name}</div>`;
  return `<button data-k='member' data-v=''>‹ ランキングに戻る</button><h2 style='margin:10px 0 6px'>${iconImg(uid,30)} ${name} の記録</h2>`
    +(tot.n?`<div class='diag-summary'>${sumLabel}　合計 ${tot.h}/${tot.n}本（${pct(tot)}%）／皆中 ${tot.kai}回</div>${chartSvg(series,per)}${legend}`:'')
    +`<div class='history-list'>${rows||'<div style="color:var(--muted);">該当する記録がありません</div>'}</div>`;
}

async function saveProfile(){
  const v=id=>{const x=document.getElementById(id);return x?x.value.trim():'';};

  if(!name){profileMsg='表示名を入力してください';renderProfilePage();return;}
  myName=name;
  nameUpdatedAt=Date.now();
  const oldIcon=profile.icon;
  profile={org:v('pfOrg').slice(0,30),grade:v('pfGrade'),years:v('pfYears').slice(0,20),bio:v('pfBio').slice(0,200)};
  if(oldIcon)profile.icon=oldIcon;

  if(dbCap&&myId){
    try{
      await dbCap.doc('members/'+myId).set({profile:profile,name:myName,updated:Date.now()},{merge:true});

}

async function obJoinTeam(code){
  if(myTeams.length)return false;
  try{
    const q=await dbCap.collection('teams').where('code','==',code).get();
    if(q.empty)return false;
    const d=q.docs[0];
    if(!myTeams.includes(d.id)){myTeams.push(d.id);teamInfo[d.id]=d.data();st.team=d.id;}
    saveLocalTeams();
    if(dbCap&&myId){try{await dbCap.doc('members/'+myId).set({teams:myTeams,updated:Date.now()},{merge:true});}catch(e){}}
    scheduleShare();return true;
  }catch(e){return false;}
}
async function obCreateTeam(name){
  if(myTeams.length)return false;
  try{
    let code='';
    for(let i=0;i<5&&!code;i++){const c=genCode(),q=await dbCap.collection('teams').where('code','==',c).get();if(q.empty)code=c;}
    if(!code)return false;
    const ref=dbCap.collection('teams').doc();
    await ref.set({name,code,owner:myId,created:Date.now()});
    teamInfo[ref.id]={name,code,owner:myId};myTeams.push(ref.id);st.team=ref.id;
    saveLocalTeams();
    if(dbCap&&myId){try{await dbCap.doc('members/'+myId).set({teams:myTeams,updated:Date.now()},{merge:true});}catch(e){}}
    scheduleShare();return true;
  }catch(e){return false;}
}
/* 墓標（削除済み）を解除する：再度同意・初回設定をしたとき、共有が再開できるようにする */
async function clearTombstoneIfNeeded(){
  if(!dbCap||!myId)return;
  const m=members[myId];
  if(!m||!m.deleted)return;
  try{
    await dbCap.doc('members/'+myId).set({deleted:false,updated:Date.now()},{merge:true});
    if(members[myId])members[myId].deleted=false;
  }catch(e){}
}
/* 初回ログイン時の同意。同意しない限りアプリは使えない。 */
async function handleConsent(act){
  if(act==='back'){obStep=0;obMsg='';renderOnboard();return;}
  if(act==='decline'){obStep='declined';obMsg='';renderOnboard();return;}
  if(act!=='agree')return;
  await clearTombstoneIfNeeded();
  consent={agreed:true,at:Date.now(),v:1};
  if(members[myId])members[myId].consent=consent;
  if(dbCap&&myId){try{await dbCap.doc('members/'+myId).set({consent:consent,updated:Date.now()},{merge:true});}catch(e){}}
  consentDone=true;scheduleShare();
  const needOnboard=!(members[myId]&&members[myId].onboarded)&&!obDone;
  if(needOnboard){obStep=1;obMsg='';renderOnboard();}
  else{obDone=true;const g=document.getElementById('onboardOverlay');if(g){g.style.display='none';g.innerHTML='';}}
}
async function withdrawConsent(){
  if(!confirm('共有への同意を撤回しますか？撤回すると、このアプリは使えなくなります。'))return;
  consent={agreed:false,at:Date.now(),v:1};
  if(members[myId])members[myId].consent=consent;
  if(dbCap&&myId){try{await dbCap.doc('members/'+myId).set({consent:consent,updated:Date.now()},{merge:true});}catch(e){}}
  consentDone=false;obDone=false;obStep=0;
  setPage('rec');checkOnboarding();
}
async function deleteMyData(){
  if(!confirm('自分のデータを削除しますか？\n記録・プロフィール・チームへの参加が Firebase から削除され、この端末の記録も消えます。自分が作ったチームは残ります。'))return;
  if(!confirm('本当に削除しますか？この操作は取り消せません。'))return;
  /* ドキュメントは削除せず墓標を残す（別端末の共有で削除が復活しないようにするため）。
     墓標の書き込みに失敗したら中断する（削除されていないのに端末内を消さないため） */
  if(dbCap&&myId){
    try{await dbCap.doc('members/'+myId).set({v:2,deleted:true,deletedAt:Date.now(),sessions:[],teams:[],name:'',profile:{},roster:{},consent:null,updated:Date.now()},{merge:true});}
    catch(e){try{alert('データの削除に失敗しました。通信状況を確認してから再度お試しください。');}catch(err){}return;}
  }
  try{localStorage.removeItem(OWNER_KEY);}catch(e){}
  clearLocalUserData();
  try{await firebase.auth().signOut();}catch(e){}
  location.reload();
}
async function finishOnboarding(){
  const v=obProfileValues();
  const u=authUser();
  const name=(v.name||myName||(u&&u.displayName)||'').trim().slice(0,20);
  if(!name){obMsg='表示名を入力してください';obStep=1;renderOnboard();return;}
  if((obChoice==='join'||obChoice==='create')&&myTeams.length){obMsg='チームは1つだけ参加できます。まず今のチームを退出してください';obStep=2;renderOnboard();return;}
  if(obChoice==='join'){
    if(!v.code){obMsg='招待コードを入力してください';obStep=2;renderOnboard();return;}
    if(!await obJoinTeam(v.code.toUpperCase())){obMsg='その招待コードのチームが見つかりませんでした';obStep=2;renderOnboard();return;}
  }else if(obChoice==='create'){
    if(!v.teamName){obMsg='チーム名を入力してください';obStep=2;renderOnboard();return;}
    if(!await obCreateTeam(v.teamName)){obMsg='チームを作成できませんでした';obStep=2;renderOnboard();return;}
  }
  myName=name;
  nameUpdatedAt=Date.now();
  const oldIcon=profile.icon;
  profile={org:v.org.slice(0,30),grade:v.grade,years:v.years.slice(0,20),bio:v.bio.slice(0,200)};
  if(v.icon)profile.icon=v.icon;else if(oldIcon)profile.icon=oldIcon;
  profileUpdatedAt=Date.now();
  saveLocalTeams();
  if(dbCap&&myId){
    try{
      await clearTombstoneIfNeeded();
      await dbCap.doc('members/'+myId).set({profile:profile,name:myName,teams:myTeams,onboarded:true,updated:Date.now()},{merge:true});
      if(members[myId])members[myId].onboarded=true;
    }catch(e){}
  }
  obDone=true;obMsg='';
  const g=document.getElementById('onboardOverlay');if(g){g.style.display='none';g.innerHTML='';}
  updateAuthBar();updateTeamBar();setPage('rec');
}
async function skipOnboarding(){
  /* プロフィールは書き換えない（既存の所属・段位などが消えないようにする）。
     表示名だけ入力されていたら名前として残す。 */
  const v=obProfileValues();
  const enteredName=(v.name||'').trim().slice(0,20);
  if(enteredName){myName=enteredName;nameUpdatedAt=Date.now();}
  saveLocalTeams();
  if(dbCap&&myId){
    try{
      await clearTombstoneIfNeeded();
      const payload={onboarded:true,updated:Date.now()};
      if(enteredName)payload.name=myName;
      await dbCap.doc('members/'+myId).set(payload,{merge:true});
      if(members[myId])members[myId].onboarded=true;
    }catch(e){}
  }
  obDone=true;obMsg='';
  const g=document.getElementById('onboardOverlay');if(g){g.style.display='none';g.innerHTML='';}
  updateAuthBar();setPage('rec');
}

  tp.addEventListener('click',e=>{
    const b=e.target.closest('button[data-k]');if(b){setStat(b.dataset.k,b.dataset.v);return;}
    const fb=e.target.closest('button[data-fb-act]');if(fb){if(fb.dataset.fbAct==='save')saveFirebaseConfigFromInput();else if(fb.dataset.fbAct==='clear'){if(confirm('Firebaseの設定をこの端末から外しますか？'))clearFirebaseConfig();}return;}
    const sb=e.target.closest('button[data-share]');if(sb){setShare(sb.dataset.share);return;}
    const cp=e.target.closest('button[data-copy-code]');if(cp){copyInviteCode(cp.dataset.copyCode,cp);return;}
    const lv=e.target.closest('button[data-leave]');if(lv){leaveTeam(lv.dataset.leave);return;}
    const sh=e.target.closest('button[data-team-show]');if(sh){st.team=sh.dataset.teamShow;updateTeamBar();renderStats();return;}
    const rm=e.target.closest('button[data-remove-member]');if(rm){const t=teamNow();if(t!=='all'){localRoster[t]=(localRoster[t]||[]).filter(m=>m.id!==rm.dataset.removeMember);saveLocalTeams();renderStats();}return;}
    const ta=e.target.closest('button[data-team-act]');if(ta){
      /* 押されたボタンと同じカード内の入力を読む（ランキングとチームの両ページに
         同じ id の入力があるため）。 */
      const card=ta.closest('.card');
      if(ta.dataset.teamAct==='create')createTeam(card);
      else if(ta.dataset.teamAct==='join')joinTeam(card);
      else if(ta.dataset.teamAct==='saveName'){const x=card?card.querySelector('#myNameInput'):document.getElementById('myNameInput');myName=((x&&x.value)||'').trim().slice(0,20);nameUpdatedAt=Date.now();saveLocalTeams();if(dbCap&&myId){dbCap.doc('members/'+myId).set({name:myName,updated:Date.now()},{merge:true}).catch(()=>{});}teamMsg=myName?'表示名を「'+myName+'」にしました':'';scheduleShare();updateAuthBar();renderStats();}
      else if(ta.dataset.teamAct==='addMember'){const x=card?card.querySelector('#memberName'):document.getElementById('memberName');const n=((x&&x.value)||'').trim().slice(0,20);if(!n){teamMsg='追加する名前を入力してください';renderStats();return;}addRosterMember(n);}
      return;}
    const r=e.target.closest('[data-uid]');if(r){st.member=r.dataset.uid;renderStats();window.scrollTo(0,0);}
  });
  tp.addEventListener('change',e=>{const sel=e.target.closest('select[data-k]');if(sel)setStat(sel.dataset.k,sel.value);});
});
window.addEventListener('hashchange',applyHash);
/* 別タブで記録が変わったら、このタブの表示も読み直す（2タブ同時使用で上書きされないようにするため） */
window.addEventListener('storage',e=>{
  if(e.key===STORE_KEY&&e.newValue){
    /* 置き換えではなく統合する（他タブの保存でこのタブの記録が消えないようにするため） */
    try{mergeStoreFromStorage();}catch(err){}
    renderAll();renderStats();
  }else if(e.key==='kyudo_local_teams_v1'&&e.newValue){
    try{
      const lt=JSON.parse(e.newValue);
      if(lt&&Array.isArray(lt.teams))localTeams=lt.teams;
      if(lt&&lt.roster&&typeof lt.roster==='object')localRoster=lt.roster;
      updateTeamBar();renderStats();
    }catch(err){}
  }
});
applyHash();

// 保存済み動画の復元
(async()=>{
  await dbOpen();
  if(!_db)return;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  const keys=await dbTx('readonly',s=>s.getAllKeys());
  const ids=new Set(store.sessions.flatMap(x=>x.shots.map(s=>s.id)));
  for(const k of keys){
    if(!ids.has(k)){dbDel(k);continue;}
    const b=await dbTx('readonly',s=>s.get(k));
    if(b)videoUrlMap[k]=URL.createObjectURL(b);
  }
  renderHistory();
})().catch(()=>{});
</script>
<script type="module">
/* AI版：Firebase AI Logic（Gemini）の呼び出し。
   compat SDK（v10.12.2）とは別にモジュール版 SDK（v13.4.0）を使い、
   'ai' という名前のアプリとして初期化する。APIキーはクライアントに
   埋め込まない（Firebase AI Logic のプロキシがサーバー側で鍵を差し込む）。
   App Check（reCAPTCHA Enterprise）が必須。サイトキーは Google Cloud
   コンソールの Fraud Defense で作り、下の RECAPTCHA_ENTERPRISE_SITE_KEY
   に貼ること。reCAPTCHA Classic（v3）はコンソールで新規登録を受け付け
   なくなったため使わない。 */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {initializeAppCheck,ReCaptchaEnterpriseProvider} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app-check.js';
import {getAI,GoogleAIBackend,getGenerativeModel} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-ai.js';
const RECAPTCHA_ENTERPRISE_SITE_KEY='6LeaCCYuAAAAAMd8E_zgklS3CYhJ2BoFrme0Ua-K';
const AI_MODEL_MODULE='gemini-3.5-flash-lite';
try{
  const cfg=window.__FIREBASE_CONFIG__||null;
  if(!cfg||!cfg.apiKey){window.__aiNotConfigured=true;throw new Error('no firebase config');}
  if(!RECAPTCHA_ENTERPRISE_SITE_KEY||RECAPTCHA_ENTERPRISE_SITE_KEY==='YOUR_RECAPTCHA_ENTERPRISE_SITE_KEY'){window.__aiNotConfigured=true;}
  else{
    const aiApp=initializeApp(cfg,'ai');
    initializeAppCheck(aiApp,{provider:new ReCaptchaEnterpriseProvider(RECAPTCHA_ENTERPRISE_SITE_KEY),isTokenAutoRefreshEnabled:true});
    const ai=getAI(aiApp,{backend:new GoogleAIBackend(),useLimitedUseAppCheckTokens:true});
    window.__geminiGenerate=async(prompt)=>{
      const model=getGenerativeModel(ai,{model:AI_MODEL_MODULE});
      const res=await model.generateContent(prompt);
      return res.response.text();
    };
    window.__aiReady=true;
  }
}catch(e){
  window.__aiError=String((e&&e.message)||e);
  if(!window.__geminiGenerate)window.__aiNotConfigured=true;
}
</script>
